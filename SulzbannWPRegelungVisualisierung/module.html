<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<script src="/icons.js"></script>

<style>

/* ============================================================
   THEME
============================================================ */

:root {

    color-scheme: light dark;

    --sb-text:
        var(
            --content-color,
            #202124
        );

    --sb-muted:
        color-mix(
            in srgb,
            var(--sb-text) 62%,
            transparent
        );

    --sb-card:
        color-mix(
            in srgb,
            var(--sb-text) 7%,
            transparent
        );

    --sb-soft:
        color-mix(
            in srgb,
            var(--sb-text) 10%,
            transparent
        );

    --sb-border:
        color-mix(
            in srgb,
            var(--sb-text) 17%,
            transparent
        );

    --sb-heating:#d97f2b;
    --sb-cooling:#2e8ec8;
    --sb-standby:#78909c;
    --sb-fault:#d84a4a;
}


@media (prefers-color-scheme:dark) {

    :root {

        --sb-text:
            var(
                --content-color,
                #f3f5f7
            );

        --sb-muted:
            color-mix(
                in srgb,
                var(--sb-text) 68%,
                transparent
            );

        --sb-card:
            rgba(
                255,
                255,
                255,
                .055
            );

        --sb-soft:
            rgba(
                255,
                255,
                255,
                .085
            );

        --sb-border:
            rgba(
                225,
                240,
                246,
                .18
            );

        --sb-heating:#ff9c48;
        --sb-cooling:#46a9e5;
        --sb-standby:#91a0a8;
        --sb-fault:#ef6262;
    }
}


* {
    box-sizing:border-box;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

    color:var(--sb-text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


button {

    font:inherit;

    color:inherit;
}


#app {

    width:100%;
    height:100%;

    overflow:hidden;
}


/* ============================================================
   SAFE AREA
============================================================ */

.view-shell {

    width:100%;
    height:100%;

    padding:
        50px
        10px
        10px
        10px;
}


/* ============================================================
   BASIS
============================================================ */

.status-dot {

    width:10px;
    height:10px;

    min-width:10px;

    border-radius:50%;

    background:var(--sb-standby);
}


.status-dot.heating {
    background:var(--sb-heating);
}


.status-dot.cooling {
    background:var(--sb-cooling);
}


.status-dot.standby {
    background:var(--sb-standby);
}


.status-dot.fault {
    background:var(--sb-fault);
}


.label {

    font-size:12px;

    line-height:1.18;

    color:var(--sb-muted);
}


.value {

    margin-top:3px;

    font-size:16px;

    line-height:1.15;

    font-weight:700;

    color:var(--sb-text);
}


.card {

    background:var(--sb-card);

    border:
        1px
        solid
        var(--sb-border);

    border-radius:9px;

    min-width:0;
}


/* ============================================================
   HEADER
============================================================ */

.compact {

    display:flex;

    flex-direction:column;

    gap:7px;

    min-height:0;
}


.compact-head {

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    min-height:34px;
}


.compact-mode {

    display:flex;

    align-items:center;

    gap:7px;

    min-width:0;
}


.compact-mode-value {

    font-size:16px;

    font-weight:700;

    line-height:1.15;
}


/* ============================================================
   BUTTONS
============================================================ */

.actions {

    display:flex;

    align-items:center;

    gap:6px;
}


.action-button {

    width:36px;
    height:36px;

    padding:0;

    border:
        1px
        solid
        var(--sb-border);

    border-radius:8px;

    background:var(--sb-soft);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:14px;

    font-weight:600;
}


.action-button:disabled {

    opacity:.38;

    cursor:default;
}


/* ============================================================
   DATEN
============================================================ */

.compact-grid {

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:6px;

    min-height:0;
}


.compact-card {

    min-height:61px;

    padding:
        8px
        9px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}


.span-2 {

    grid-column:
        span 2;
}


/* ============================================================
   DIAGNOSE
============================================================ */

.mobile-diagnostic {

    display:none;

    margin-top:1px;

    padding:
        5px
        7px;

    border:
        1px
        solid
        var(--sb-border);

    border-radius:7px;

    background:var(--sb-soft);

    font-size:10px;

    line-height:1.3;

    color:var(--sb-muted);
}


.mobile-diagnostic.active {

    display:block;
}


.mobile-diagnostic strong {

    color:var(--sb-text);
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media (max-width:700px) {

    .view-shell {

        padding:
            48px
            7px
            7px
            7px;
    }


    .compact-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        gap:5px;
    }


    .compact-card {

        min-height:58px;

        padding:
            7px
            8px;
    }


    .label {
        font-size:11px;
    }


    .value {
        font-size:15px;
    }


    .span-2 {

        grid-column:
            auto;
    }
}


@media (max-width:380px) {

    .compact-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }


    .compact-card {

        min-height:55px;
    }


    .label {
        font-size:10px;
    }


    .value {
        font-size:14px;
    }
}

</style>

</head>


<body>


<div id="app"></div>



<!-- ============================================================
     COMPACT TEMPLATE
============================================================ -->

<template id="compactTemplate">

<div class="view-shell compact">


    <div class="compact-head">


        <div class="compact-mode">

            <span
                data-role="modeDot"
                class="status-dot standby"
            ></span>


            <div>

                <div class="label">
                    WP Master-Betriebsart
                </div>


                <div
                    class="compact-mode-value"
                    data-role="mode"
                >
                    —
                </div>

            </div>

        </div>


        <div class="actions">

            <button
                data-role="grossButton"
                class="action-button"
                type="button"
                title="Grossansicht"
            >
                ↗
            </button>


            <button
                data-role="settingsButton"
                class="action-button"
                type="button"
                title="Einstellungen"
            >
                ⚙
            </button>

        </div>

    </div>



    <div class="compact-grid">


        <div class="card compact-card">

            <div class="label">
                Aussentemperatur
            </div>

            <div
                class="value"
                data-role="outside"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                WP Vorlauf
            </div>

            <div
                class="value"
                data-role="flow"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                WP Rücklauf
            </div>

            <div
                class="value"
                data-role="return"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Raumtemperatur Ø
            </div>

            <div
                class="value"
                data-role="roomAverage"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                FBH Ventile
            </div>

            <div
                class="value"
                data-role="valvesOpen"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Stellwert max.
            </div>

            <div
                class="value"
                data-role="demandMaximum"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Boiler oben
            </div>

            <div
                class="value"
                data-role="dhwTop"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Boiler unten
            </div>

            <div
                class="value"
                data-role="dhwBottom"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Puffer oben
            </div>

            <div
                class="value"
                data-role="bufferTop"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Puffer Mitte
            </div>

            <div
                class="value"
                data-role="bufferMiddle"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                Puffer unten
            </div>

            <div
                class="value"
                data-role="bufferBottom"
            >
                —
            </div>

        </div>


        <div class="card compact-card">

            <div class="label">
                WP Modulation
            </div>

            <div
                class="value"
                data-role="modulation"
            >
                —
            </div>

        </div>


    </div>



    <div
        class="mobile-diagnostic"
        data-role="mobileDiagnostic"
    >
    </div>


</div>

</template>



<script>

"use strict";


const INITIAL_DATA =
    __SBWRV_INITIAL_DATA__;


let currentData =
    (
        INITIAL_DATA
        &&
        typeof INITIAL_DATA === "object"
    )
        ?
        INITIAL_DATA
        :
        {};


/* ============================================================
   HELPERS
============================================================ */

function allRole(role) {

    return document.querySelectorAll(
        '[data-role="'
        +
        role
        +
        '"]'
    );
}


function setRoleText(
    role,
    value
) {

    allRole(
        role
    )
    .forEach(
        element => {

            element.textContent =
                value;
        }
    );
}


function isNumber(value) {

    return (
        typeof value === "number"
        &&
        Number.isFinite(value)
    );
}


function fmt(
    value,
    digits,
    suffix
) {

    return isNumber(value)
        ?
        value.toFixed(digits)
        +
        suffix
        :
        "—";
}


function fmtTemp(value) {

    return fmt(
        value,
        1,
        " °C"
    );
}


function fmtPercent(value) {

    return fmt(
        value,
        0,
        " %"
    );
}


/* ============================================================
   MOBILE ERKENNUNG
============================================================ */

function isLikelyMobileClient() {

    const ua =
        navigator.userAgent
        ||
        "";


    const byUA =
        /Android|iPhone|iPad|iPod|Mobile/i.test(
            ua
        );


    const byWidth =
        window.innerWidth
        <=
        700;


    return (
        byUA
        ||
        byWidth
    );
}


/* ============================================================
   DIAGNOSE
============================================================ */

function showDiagnostic(
    message
) {

    const box =
        document.querySelector(
            '[data-role="mobileDiagnostic"]'
        );


    if (!box) {
        return;
    }


    const openObjectAvailable =
        typeof openObject
        ===
        "function";


    const requestActionAvailable =
        typeof requestAction
        ===
        "function";


    const width =
        window.innerWidth;


    const height =
        window.innerHeight;


    box.classList.add(
        "active"
    );


    box.innerHTML =
        "<strong>"
        +
        message
        +
        "</strong>"
        +
        "<br>"
        +
        "openObject: "
        +
        (
            openObjectAvailable
                ?
                "JA"
                :
                "NEIN"
        )
        +
        " · requestAction: "
        +
        (
            requestActionAvailable
                ?
                "JA"
                :
                "NEIN"
        )
        +
        " · Viewport: "
        +
        width
        +
        " × "
        +
        height;
}


/* ============================================================
   RENDER
============================================================ */

function renderCompact() {

    const app =
        document.getElementById(
            "app"
        );


    const tpl =
        document.getElementById(
            "compactTemplate"
        );


    app.innerHTML =
        "";


    app.appendChild(
        tpl.content.cloneNode(
            true
        )
    );


    bindButtons();

    applyData();
}


/* ============================================================
   NAVIGATION
============================================================ */

function openLocalObject(
    objectID,
    label
) {

    const target =
        Number(
            objectID
            ||
            0
        );


    if (target <= 0) {

        showDiagnostic(
            label
            +
            ": Ziel-ID fehlt"
        );

        return false;
    }


    if (
        typeof openObject
        !==
        "function"
    ) {

        showDiagnostic(
            label
            +
            ": openObject nicht verfügbar"
        );

        return false;
    }


    /*
     * MOBILE:
     *
     * Der bisherige Test führte dazu,
     * dass die Werte aus der Kachel verschwanden.
     *
     * Deshalb wird Mobile in diesem Diagnose-Stand
     * bewusst NICHT erneut blind umgeschaltet.
     */
    if (
        isLikelyMobileClient()
    ) {

        showDiagnostic(
            label
            +
            ": Mobile-Navigation vorerst blockiert"
        );

        return false;
    }


    /*
     * DESKTOP / BROWSER:
     * bestätigter funktionierender clientlokaler Weg.
     */
    try {

        openObject(
            target
        );


        return true;

    } catch (error) {

        showDiagnostic(
            label
            +
            ": "
            +
            String(error)
        );


        return false;
    }
}


/* ============================================================
   BUTTONS
============================================================ */

function bindButtons() {

    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    openLocalObject(
                        currentData.settingsObjectID,
                        "Einstellungen"
                    );
                }
            );
        }
    );


    allRole(
        "grossButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    openLocalObject(
                        currentData.grossObjectID,
                        "Grossansicht"
                    );
                }
            );
        }
    );
}


/* ============================================================
   APPLY DATA
============================================================ */

function applyData() {

    const d =
        currentData
        ||
        {};


    const wp =
        d.wp
        ||
        {};


    const rooms =
        d.rooms
        ||
        {};


    const fbh =
        d.fbh
        ||
        {};


    const dhw =
        d.dhw
        ||
        {};


    const buffer =
        d.buffer
        ||
        {};


    setRoleText(
        "mode",
        wp.mode
        ||
        "—"
    );


    allRole(
        "modeDot"
    )
    .forEach(
        element => {

            element.className =
                "status-dot "
                +
                (
                    wp.modeCode
                    ||
                    "standby"
                );
        }
    );


    setRoleText(
        "outside",
        fmtTemp(
            wp.outside
        )
    );


    setRoleText(
        "flow",
        fmtTemp(
            wp.flow
        )
    );


    setRoleText(
        "return",
        fmtTemp(
            wp.return
        )
    );


    setRoleText(
        "modulation",
        fmtPercent(
            wp.modulation
        )
    );


    setRoleText(
        "roomAverage",
        fmtTemp(
            rooms.average
        )
    );


    setRoleText(
        "valvesOpen",
        (
            isNumber(
                fbh.open
            )
            &&
            isNumber(
                fbh.total
            )
        )
            ?
            fbh.open
            +
            " / "
            +
            fbh.total
            :
            "—"
    );


    setRoleText(
        "demandMaximum",
        fmtPercent(
            fbh.demandMaximum
        )
    );


    setRoleText(
        "dhwTop",
        fmtTemp(
            dhw.top
        )
    );


    setRoleText(
        "dhwBottom",
        fmtTemp(
            dhw.bottom
        )
    );


    setRoleText(
        "bufferTop",
        fmtTemp(
            buffer.top
        )
    );


    setRoleText(
        "bufferMiddle",
        fmtTemp(
            buffer.middle
        )
    );


    setRoleText(
        "bufferBottom",
        fmtTemp(
            buffer.bottom
        )
    );
}


/* ============================================================
   LIVE MESSAGE
============================================================ */

function handleMessage(data) {

    if (
        typeof data
        ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }
    }


    if (
        !data
        ||
        typeof data
        !==
        "object"
    ) {
        return;
    }


    currentData =
        data;


    applyData();
}


/* ============================================================
   START
============================================================ */

window.addEventListener(
    "load",
    () => {

        renderCompact();


        if (
            typeof requestAction
            ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );
        }
    }
);

</script>

</body>

</html>
