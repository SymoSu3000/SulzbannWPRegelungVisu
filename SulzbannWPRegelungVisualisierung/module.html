<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<script src="/icons.js"></script>

<style>

/* ============================================================
   THEME
============================================================ */

:root {
    color-scheme: light dark;

    --sb-text:
        var(
            --content-color,
            #202124
        );

    --sb-muted:
        color-mix(
            in srgb,
            var(--sb-text) 62%,
            transparent
        );

    --sb-card:
        color-mix(
            in srgb,
            var(--sb-text) 7%,
            transparent
        );

    --sb-soft:
        color-mix(
            in srgb,
            var(--sb-text) 10%,
            transparent
        );

    --sb-border:
        color-mix(
            in srgb,
            var(--sb-text) 17%,
            transparent
        );

    --sb-heating:#d97f2b;
    --sb-cooling:#2e8ec8;
    --sb-standby:#78909c;
    --sb-fault:#d84a4a;
}


@media (prefers-color-scheme:dark) {

    :root {
        --sb-text:
            var(
                --content-color,
                #f3f5f7
            );

        --sb-muted:
            color-mix(
                in srgb,
                var(--sb-text) 68%,
                transparent
            );

        --sb-card:
            rgba(
                255,
                255,
                255,
                .055
            );

        --sb-soft:
            rgba(
                255,
                255,
                255,
                .085
            );

        --sb-border:
            rgba(
                225,
                240,
                246,
                .18
            );

        --sb-heating:#ff9c48;
        --sb-cooling:#46a9e5;
        --sb-standby:#91a0a8;
        --sb-fault:#ef6262;
    }
}


/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing:border-box;
}


html,
body {
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

    color:var(--sb-text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


button {
    font:inherit;
    color:inherit;
}


#app {
    width:100%;
    height:100%;

    overflow:hidden;
}


/* ============================================================
   KACHEL
============================================================ */

.view-shell {
    width:100%;
    height:100%;

    min-height:0;

    padding:
        50px
        10px
        10px
        10px;
}


.compact {
    display:flex;

    flex-direction:column;

    gap:7px;

    min-height:0;
}


/* ============================================================
   HEADER
============================================================ */

.compact-head {
    flex:
        0
        0
        auto;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    min-height:34px;
}


.compact-mode {
    display:flex;

    align-items:center;

    gap:7px;

    min-width:0;
}


.status-dot {
    width:10px;
    height:10px;

    min-width:10px;

    border-radius:50%;

    background:var(--sb-standby);
}


.status-dot.heating {
    background:var(--sb-heating);
}


.status-dot.cooling {
    background:var(--sb-cooling);
}


.status-dot.standby {
    background:var(--sb-standby);
}


.status-dot.fault {
    background:var(--sb-fault);
}


.label {
    font-size:13px;
    line-height:1.18;

    color:var(--sb-muted);
}


.compact-mode-value {
    margin-top:2px;

    font-size:17px;
    line-height:1.15;

    font-weight:700;
}


/* ============================================================
   HAUPT-AKTIONEN
============================================================ */

.actions {
    display:flex;

    align-items:center;

    gap:6px;

    flex:
        0
        0
        auto;
}


.action-button {
    width:36px;
    height:36px;

    padding:0;

    border:
        1px
        solid
        var(--sb-border);

    border-radius:8px;

    background:var(--sb-soft);

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:14px;
    font-weight:600;
}


.action-button:active {
    opacity:.72;
}


.action-button:disabled {
    opacity:.38;

    cursor:default;
}


/* ============================================================
   SEITENWAHL
============================================================ */

.page-selector {
    flex:
        0
        0
        auto;

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:5px;

    padding:2px;

    border:
        1px
        solid
        var(--sb-border);

    border-radius:8px;

    background:
        color-mix(
            in srgb,
            var(--sb-text) 4%,
            transparent
        );
}


.page-button {
    min-height:30px;

    padding:
        4px
        10px;

    border:0;

    border-radius:6px;

    background:transparent;

    color:var(--sb-muted);

    cursor:pointer;

    font-size:13px;
    line-height:1.1;

    font-weight:600;
}


.page-button.active {
    background:var(--sb-soft);

    color:var(--sb-text);
}


.page-button:active {
    opacity:.72;
}


/* ============================================================
   SEITENBEREICH
============================================================ */

/*
 * KEIN vertikales internes Scrollen.
 *
 * Stattdessen immer genau eine Datenseite darstellen.
 */

.compact-pages {
    flex:
        1
        1
        auto;

    min-height:0;

    overflow:hidden;
}


.page-panel {
    width:100%;
    height:100%;

    min-height:0;

    display:none;
}


.page-panel.active {
    display:block;
}


/* ============================================================
   DATENKARTEN
============================================================ */

.compact-grid {
    width:100%;
    height:100%;

    min-height:0;

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    grid-template-rows:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:6px;
}


.card {
    background:var(--sb-card);

    border:
        1px
        solid
        var(--sb-border);

    border-radius:9px;

    min-width:0;
    min-height:0;
}


.compact-card {
    padding:
        6px
        9px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    overflow:hidden;
}


.value {
    margin-top:3px;

    font-size:17px;
    line-height:1.15;

    font-weight:700;

    white-space:nowrap;
}


/* ============================================================
   MOBILE / TABLET
============================================================ */

@media (max-width:700px) {

    .view-shell {
        padding:
            48px
            7px
            7px
            7px;
    }


    .compact-grid {
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        grid-template-rows:
            repeat(
                3,
                minmax(0,1fr)
            );

        gap:5px;
    }


    .compact-card {
        padding:
            5px
            8px;
    }


    .label {
        font-size:12px;
    }


    .value {
        font-size:16px;
    }


    .compact-mode-value {
        font-size:16px;
    }


    .page-button {
        min-height:29px;

        font-size:12px;
    }
}


@media (max-width:380px) {

    .compact-card {
        padding:
            4px
            7px;
    }


    .value {
        font-size:15px;
    }
}


/* ============================================================
   SEHR NIEDRIGE KACHEL
============================================================ */

@media (max-height:330px) {

    .view-shell {
        padding-top:46px;
    }


    .compact {
        gap:5px;
    }


    .compact-head {
        min-height:30px;
    }


    .action-button {
        width:32px;
        height:32px;
    }


    .page-button {
        min-height:26px;

        padding-top:2px;
        padding-bottom:2px;
    }


    .compact-card {
        padding-top:3px;
        padding-bottom:3px;
    }
}

</style>

</head>


<body>


<div id="app"></div>



<!-- ============================================================
     COMPACT TEMPLATE
============================================================ -->

        ===================================================== -->

                <div>

            <div class="actions">

                        </div>

                            class="value"
                            data-role="dhwTop"

                            class="value"

                    <div class="card compact-card">

                    </div>


                    <div class="card compact-card">

                            Puffer Mitte

                            class="value"
                            data-role="bufferMiddle"
                        >

                    </div>


                    <div class="card compact-card">

                        <div class="label">
                            Puffer unten

                            class="value"

</template>



<script>

"use strict";


const INITIAL_DATA =
    __SBWRV_INITIAL_DATA__;


let currentData =
    isObject(
        INITIAL_DATA
    )
        ?
        cloneValue(
            INITIAL_DATA
        )
        :
        {};


let refreshAttempts =
    0;


let refreshTimer =
    null;


/*
 * Die Seitenauswahl ist rein lokal.
 */
let currentPage =
    0;


/* ============================================================
   OBJECT / MERGE
============================================================ */

function isObject(value) {

    return (
        value !== null
        &&
        typeof value
        ===
        "object"
        &&
        !Array.isArray(value)
    );
}


function cloneValue(value) {

    if (
        Array.isArray(value)
    ) {

        return value.map(
            cloneValue
        );
    }


    if (
        isObject(value)
    ) {

        const out =
            {};


        Object.keys(
            value
        )
        .forEach(
            key => {

                out[key] =
                    cloneValue(
                        value[key]
                    );
            }
        );


        return out;
    }


    return value;
}


function mergeData(
    base,
    incoming
) {

    const result =
        isObject(base)
            ?
            cloneValue(base)
            :
            {};


    if (
        !isObject(incoming)
    ) {
        return result;
    }


    Object.keys(
        incoming
    )
    .forEach(
        key => {

            const next =
                incoming[key];


            if (
                isObject(next)
            ) {

                result[key] =
                    mergeData(
                        isObject(
                            result[key]
                        )
                            ?
                            result[key]
                            :
                            {},
                        next
                    );

                return;
            }


            /*
             * Null oder undefined darf einen vorhandenen
             * gültigen Wert nicht zerstören.
             */
            if (
                next === null
                ||
                typeof next
                ===
                "undefined"
            ) {

                if (
                    !(key in result)
                ) {
                    result[key] =
                        next;
                }

                return;
            }


            result[key] =
                next;
        }
    );


    return result;
}


/* ============================================================
   PAYLOAD PRÜFEN
============================================================ */

function isExpectedPayload(data) {

    if (
        !isObject(data)
    ) {
        return false;
    }


    return (
        isObject(data.wp)
        ||
        isObject(data.rooms)
        ||
        isObject(data.fbh)
        ||
        isObject(data.dhw)
        ||
        isObject(data.buffer)
        ||
        isObject(data.meteo)
        ||
        isObject(data.solcast)
        ||
        typeof data.settingsObjectID
        ===
        "number"
        ||
        typeof data.grossObjectID
        ===
        "number"
    );
}


function hasCoreData() {

    const wp =
        isObject(
            currentData.wp
        )
            ?
            currentData.wp
            :
            {};


    const rooms =
        isObject(
            currentData.rooms
        )
            ?
            currentData.rooms
            :
            {};


    const fbh =
        isObject(
            currentData.fbh
        )
            ?
            currentData.fbh
            :
            {};


    return (
        typeof wp.mode
        ===
        "string"
        &&
        wp.mode.length
        >
        0
        &&
        (
            Number.isFinite(
                wp.outside
            )
            ||
            Number.isFinite(
                wp.flow
            )
            ||
            Number.isFinite(
                wp.return
            )
            ||
            Number.isFinite(
                rooms.average
            )
            ||
            Number.isFinite(
                fbh.total
            )
        )
    );
}


/* ============================================================
   DOM
============================================================ */

function allRole(role) {

    return document.querySelectorAll(
        '[data-role="'
        +
        role
        +
        '"]'
    );
}


function setRoleText(
    role,
    value
) {

    allRole(
        role
    )
    .forEach(
        element => {

            if (
                element.textContent
                !==
                value
            ) {
                element.textContent =
                    value;
            }
        }
    );
}


/* ============================================================
   FORMAT
============================================================ */

function isNumber(value) {

    return (
        typeof value
        ===
        "number"
        &&
        Number.isFinite(value)
    );
}


function fmt(
    value,
    digits,
    suffix
) {

    return isNumber(value)
        ?
        value.toFixed(
            digits
        )
        +
        suffix
        :
        "—";
}


function fmtTemp(value) {

    return fmt(
        value,
        1,
        " °C"
    );
}


function fmtPercent(value) {

    return fmt(
        value,
        0,
        " %"
    );
}


/* ============================================================
   RENDER
============================================================ */

function renderCompact() {

    const app =
        document.getElementById(
            "app"
        );


    const tpl =
        document.getElementById(
            "compactTemplate"
        );


    app.innerHTML =
        "";


    app.appendChild(
        tpl.content.cloneNode(
            true
        )
    );


    bindButtons();

    bindPageButtons();

    showPage(
        currentPage
    );

    applyData();
}


/* ============================================================
   LOKALE SEITENWAHL
============================================================ */

function showPage(page) {

    const requested =
        Number(page);


    currentPage =
        requested === 1
            ?
            1
            :
            0;


    document
        .querySelectorAll(
            "[data-page-panel]"
        )
        .forEach(
            panel => {

                const panelPage =
                    Number(
                        panel.getAttribute(
                            "data-page-panel"
                        )
                    );


                panel.classList.toggle(
                    "active",
                    panelPage
                    ===
                    currentPage
                );
            }
        );


    document
        .querySelectorAll(
            "[data-page-button]"
        )
        .forEach(
            button => {

                const buttonPage =
                    Number(
                        button.getAttribute(
                            "data-page-button"
                        )
                    );


                button.classList.toggle(
                    "active",
                    buttonPage
                    ===
                    currentPage
                );
            }
        );
}


function bindPageButtons() {

    document
        .querySelectorAll(
            "[data-page-button]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();

                        event.stopPropagation();


                        showPage(
                            button.getAttribute(
                                "data-page-button"
                            )
                        );
                    }
                );
            }
        );
}


/* ============================================================
   CLIENTLOKALE NAVIGATION
============================================================ */

function openLocalObject(
    objectID
) {

    const target =
        Number(
            objectID
            ||
            0
        );


    if (
        target <= 0
        ||
        typeof openObject
        !==
        "function"
    ) {
        return false;
    }


    try {

        /*
         * Nur der aktuelle Client navigiert.
         */
        openObject(
            target
        );


        return true;

    } catch (error) {

        console.error(
            "SBWRV openObject failed",
            error
        );


        return false;
    }
}


/* ============================================================
   BUTTONS
============================================================ */

function bindButtons() {

    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    if (
                        !openLocalObject(
                            currentData.settingsObjectID
                        )
                    ) {

                        requestRefresh(
                            true
                        );
                    }
                }
            );
        }
    );


    allRole(
        "grossButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    if (
                        !openLocalObject(
                            currentData.grossObjectID
                        )
                    ) {

                        requestRefresh(
                            true
                        );
                    }
                }
            );
        }
    );
}


/* ============================================================
   DATEN
============================================================ */

function applyData() {

    const d =
        isObject(
            currentData
        )
            ?
            currentData
            :
            {};


    const wp =
        isObject(
            d.wp
        )
            ?
            d.wp
            :
            {};


    const rooms =
        isObject(
            d.rooms
        )
            ?
            d.rooms
            :
            {};


    const fbh =
        isObject(
            d.fbh
        )
            ?
            d.fbh
            :
            {};


    const dhw =
        isObject(
            d.dhw
        )
            ?
            d.dhw
            :
            {};


    const buffer =
        isObject(
            d.buffer
        )
            ?
            d.buffer
            :
            {};


    setRoleText(
        "mode",
        typeof wp.mode
        ===
        "string"
            ?
            wp.mode
            :
            "—"
    );


    allRole(
        "modeDot"
    )
    .forEach(
        element => {

            element.className =
                "status-dot "
                +
                (
                    typeof wp.modeCode
                    ===
                    "string"
                        ?
                        wp.modeCode
                        :
                        "standby"
                );
        }
    );


    setRoleText(
        "outside",
        fmtTemp(
            wp.outside
        )
    );


    setRoleText(
        "flow",
        fmtTemp(
            wp.flow
        )
    );


    setRoleText(
        "return",
        fmtTemp(
            wp.return
        )
    );


    setRoleText(
        "modulation",
        fmtPercent(
            wp.modulation
        )
    );


    setRoleText(
        "roomAverage",
        fmtTemp(
            rooms.average
        )
    );


    setRoleText(
        "valvesOpen",
        (
            isNumber(
                fbh.open
            )
            &&
            isNumber(
                fbh.total
            )
        )
            ?
            fbh.open
            +
            " / "
            +
            fbh.total
            :
            "—"
    );


    setRoleText(
        "demandMaximum",
        fmtPercent(
            fbh.demandMaximum
        )
    );


    setRoleText(
        "dhwTop",
        fmtTemp(
            dhw.top
        )
    );


    setRoleText(
        "dhwBottom",
        fmtTemp(
            dhw.bottom
        )
    );


    setRoleText(
        "bufferTop",
        fmtTemp(
            buffer.top
        )
    );


    setRoleText(
        "bufferMiddle",
        fmtTemp(
            buffer.middle
        )
    );


    setRoleText(
        "bufferBottom",
        fmtTemp(
            buffer.bottom
        )
    );


    /*
     * Navigationsbuttons erst aktivieren,
     * wenn Ziel-ID und openObject vorhanden sind.
     */

    const settingsOK =
        Number(
            d.settingsObjectID
            ||
            0
        )
        >
        0
        &&
        typeof openObject
        ===
        "function";


    const grossOK =
        Number(
            d.grossObjectID
            ||
            0
        )
        >
        0
        &&
        typeof openObject
        ===
        "function";


    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.disabled =
                !settingsOK;


            button.title =
                settingsOK
                    ?
                    "WP Regelung Einstellungen öffnen"
                    :
                    "Einstellungen werden geladen";
        }
    );


    allRole(
        "grossButton"
    )
    .forEach(
        button => {

            button.disabled =
                !grossOK;


            button.title =
                grossOK
                    ?
                    "Grossansicht öffnen"
                    :
                    "Grossansicht wird geladen";
        }
    );
}


/* ============================================================
   REFRESH / RETRY
============================================================ */

function requestRefresh(
    force
) {

    if (
        typeof requestAction
        !==
        "function"
    ) {
        return;
    }


    if (
        !force
        &&
        hasCoreData()
    ) {
        return;
    }


    requestAction(
        "Refresh",
        true
    );
}


function scheduleRefreshRetry() {

    if (
        refreshTimer
        !==
        null
    ) {

        clearTimeout(
            refreshTimer
        );
    }


    if (
        hasCoreData()
        ||
        refreshAttempts >= 2
    ) {

        refreshTimer =
            null;

        return;
    }


    const delays = [
        500,
        1500
    ];


    const delay =
        delays[
            refreshAttempts
        ]
        ||
        1500;


    refreshAttempts +=
        1;


    refreshTimer =
        setTimeout(
            () => {

                if (
                    !hasCoreData()
                ) {

                    requestRefresh(
                        true
                    );


                    scheduleRefreshRetry();
                }
            },
            delay
        );
}


/* ============================================================
   LIVE MESSAGE
============================================================ */

function handleMessage(data) {

    if (
        typeof data
        ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }
    }


    /*
     * Leere/fremde Nachrichten ignorieren.
     */

    if (
        !isExpectedPayload(
            data
        )
    ) {
        return;
    }


    /*
     * Neue Werte in bestehenden Zustand mergen.
     */

    currentData =
        mergeData(
            currentData,
            data
        );


    /*
     * Aktuelle Seite bleibt beim Live-Update erhalten.
     */

    applyData();


    if (
        hasCoreData()
    ) {

        refreshAttempts =
            0;


        if (
            refreshTimer
            !==
            null
        ) {

            clearTimeout(
                refreshTimer
            );


            refreshTimer =
                null;
        }
    }
}


/* ============================================================
   START
============================================================ */

window.addEventListener(
    "load",
    () => {

        /*
         * Initialdaten sofort anzeigen.
         */

        renderCompact();


        /*
         * Nur bei fehlenden Daten Server-Refresh.
         */

        requestRefresh(
            false
        );


        /*
         * Maximal zwei kurze Retries.
         */

        scheduleRefreshRetry();
    }
);

</script>
