<!doctype html>

>

<script src="/icons.js"></script>


<style>

/* ============================================================
   SYMCON THEME
============================================================ */

:root {

    /*
     * Diese Farben kommen direkt von der Symcon-Kachel.
     *
     * Kein prefers-color-scheme.
     */

    --sb-text:
        var(
            --content-color,
            #ffffff
        );

    --sb-card:
        var(
            --card-color,
            #333438
        );

    --sb-accent:
        var(
            --accent-color,
            #00cdab
        );

    --sb-muted:
        color-mix(
            in srgb,
            var(--sb-text) 68%,
            transparent
        );

    --sb-border:
        color-mix(
            in srgb,
            var(--sb-text) 18%,
            transparent
        );

    --sb-soft:
        color-mix(
            in srgb,
            var(--sb-card) 82%,
            transparent
        );

    --sb-heating:
        #ff9c48;

    --sb-cooling:
        #46a9e5;

    --sb-standby:
        #8c999f;

    --sb-fault:
        #ef6262;
}


/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing:
        border-box;
}


html,
body {

    margin:
        0;

    padding:
        0;

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    background:
        transparent;

    color:
        var(--sb-text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


button {

    font:
        inherit;

    color:
        inherit;
}


#app {

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;
}


/* ============================================================
   KACHELTITEL SAFE AREA
============================================================ */

/*
 * Symcon zeichnet den Titel selbst.
 *
 * Deshalb beginnen wir bewusst erst 54 px darunter.
 *
 * Kein eigener Titel in diesem Bereich.
 */

.view-shell {

    width:
        100%;

    height:
        100%;

    padding:
        54px 12px 12px 12px;
}


/* ============================================================
   STATUS
============================================================ */

.status-dot {

    width:
        11px;

    height:
        11px;

    min-width:
        11px;

    border-radius:
        50%;

    background:
        var(--sb-standby);
}


.status-dot.heating {

    background:
        var(--sb-heating);
}


.status-dot.cooling {

    background:
        var(--sb-cooling);
}


.status-dot.standby {

    background:
        var(--sb-standby);
}


.status-dot.fault {

    background:
        var(--sb-fault);
}


/* ============================================================
   TYPOGRAFIE
============================================================ */

.label {

    font-size:
        13px;

    line-height:
        1.25;

    color:
        var(--sb-muted);
}


.value {

    font-size:
        18px;

    line-height:
        1.20;

    font-weight:
        700;

    color:
        var(--sb-text);

    margin-top:
        4px;
}


/* ============================================================
   SETTINGS
============================================================ */

.settings-button {

    height:
        38px;

    padding:
        0 12px;

    border:
        1px solid
        var(--sb-border);

    border-radius:
        9px;

    background:
        var(--sb-soft);

    color:
        var(--sb-text);

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        7px;

    cursor:
        pointer;

    white-space:
        nowrap;

    font-size:
        13px;

    font-weight:
        600;
}


.settings-button:active {

    opacity:
        0.72;
}


.settings-button:disabled {

    opacity:
        0.38;

    cursor:
        default;
}


/* ============================================================
   COMPACT
============================================================ */

.compact {

    display:
        flex;

    flex-direction:
        column;

    gap:
        10px;

    min-height:
        0;
}


.compact-head {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    min-height:
        40px;
}


.compact-mode {

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    min-width:
        0;
}


.compact-mode-value {

    font-size:
        17px;

    font-weight:
        700;

    line-height:
        1.20;

    color:
        var(--sb-text);
}


.compact-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            3,
            minmax(
                0,
                1fr
            )
        );

    gap:
        9px;

    min-height:
        0;
}


.card {

    background:
        var(--sb-soft);

    border:
        1px solid
        var(--sb-border);

    border-radius:
        11px;

    min-width:
        0;
}


.compact-card {

    padding:
        10px 11px;

    min-height:
        82px;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;
}


/* ============================================================
   DETAIL
============================================================ */

.detail {

    height:
        100%;

    overflow:
        auto;

    padding-right:
        2px;
}


.detail-head {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        16px;

    margin-bottom:
        12px;

    min-height:
        42px;
}


.detail-mode {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    min-width:
        0;
}


.detail-mode-value {

    font-size:
        21px;

    font-weight:
        700;

    line-height:
        1.20;
}


.summary-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            4,
            minmax(
                0,
                1fr
            )
        );

    gap:
        10px;

    margin-bottom:
        10px;
}


.summary-card {

    padding:
        11px 12px;

    min-height:
        76px;
}


.sections {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        10px;
}


.section {

    padding:
        13px;
}


.section-title {

    font-size:
        15px;

    line-height:
        1.25;

    font-weight:
        700;

    color:
        var(--sb-text);

    margin-bottom:
        12px;
}


.data-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(
                0,
                1fr
            )
        );

    gap:
        14px 24px;
}


.data-item {

    min-width:
        0;

    min-height:
        46px;
}


.peak-window {

    margin-top:
        14px;

    padding-top:
        12px;

    border-top:
        1px solid
        var(--sb-border);
}


.footer {

    margin-top:
        10px;

    text-align:
        right;

    font-size:
        12px;

    line-height:
        1.20;

    color:
        var(--sb-muted);

/* ============================================================
   MOBILE
============================================================ */

@media (
    max-width:

    .view-shell {

    .sections {

    }

@media (

    }

@media (
    max-width:
    340px

    .data-grid {

        grid-template-columns:
            1fr;
    }
}

</style>

<script>

"use strict";


/* ============================================================
   INITIALDATEN
============================================================ */

const INITIAL_DATA =
    __SBWRV_INITIAL_DATA__;


let currentData =
    (
        INITIAL_DATA
        &&
        typeof INITIAL_DATA
        ===
        "object"
    )
        ?
        INITIAL_DATA
        :
        {};


let currentMode =
    null;


/* ============================================================
   DOM HELPERS
============================================================ */

function allRole(role) {

    return document.querySelectorAll(
        '[data-role="'
        +
        role
        +
        '"]'
    );
}


function setRoleText(
    role,
    value
) {

    allRole(
        role
    )
    .forEach(

        function (element) {

            if (
                element.textContent
                !==
                value
            ) {

                element.textContent =
                    value;
            }

        }
    );
}


/* ============================================================
   FORMATIERUNG
============================================================ */

function isNumber(value) {

    return (
        typeof value
        ===
        "number"
        &&
        Number.isFinite(
            value
        )
    );
}


function formatNumber(
    value,
    digits,
    suffix
) {

    if (
        !isNumber(
            value
        )
    ) {

        return "—";
    }


    return (
        value.toFixed(
            digits
        )
        +
        suffix
    );
}


function formatTemperature(
    value
) {

    return formatNumber(
        value,
        1,
        " °C"
    );
}


function formatKW(
    value
) {

    return formatNumber(
        value,
        2,
        " kW"
    );
}


function formatPercent(
    value
) {

    return formatNumber(
        value,
        0,
        " %"
    );
}


function formatTime(
    timestamp
) {

    if (
        !timestamp
        ||
        timestamp <= 0
    ) {

        return "—";
    }


    const date =
        new Date(
            timestamp * 1000
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "—";
    }


    return date.toLocaleTimeString(
        "de-CH",
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );
}


/* ============================================================
   COMPACT / DETAIL
============================================================ */

function determineMode() {

    const width =
        document.documentElement
            .clientWidth;


    const height =
        document.documentElement
            .clientHeight;


    const area =
        width
        *
        height;


    /*
     * Wichtig:
     *
     * NICHT mehr:
     *
     *     height < 500
     *
     * Der Fehlversuch hat deine geöffnete
     * ca. 630 x 445 px Ansicht fälschlich
     * als Compact behandelt.
     *
     *
     * Neue Logik:
     *
     * Detail wenn:
     *
     * - genügend tatsächliche Höhe vorhanden
     * UND
     * - genügend tatsächliche Fläche vorhanden
     *
     *
     * 630 x 445:
     *
     * 280'350 px²
     *
     * => DETAIL
     *
     *
     * Kleine / kurze Kacheln:
     *
     * => COMPACT
     *
     *
     * Mobile Grossansicht:
     *
     * schmal, aber hoch und grosse Fläche
     *
     * => DETAIL
     */

    if (
        height >= 320
        &&
        area >= 190000
    ) {

        return "detail";
    }


    return "compact";
}


/* ============================================================
   MODUS RENDERN
============================================================ */

function renderMode() {

    const mode =
        determineMode();


    if (
        mode
        ===
        currentMode
    ) {

        return;
    }


    currentMode =
        mode;


    const app =
        document.getElementById(
            "app"
        );


    const template =
        document.getElementById(

            mode === "detail"

                ?

                "detailTemplate"

                :

                "compactTemplate"
        );


    app.innerHTML =
        "";


    app.appendChild(
        template.content
            .cloneNode(
                true
            )
    );


    bindButtons();

    applyData();
}


/* ============================================================
   SETTINGS BUTTON
============================================================ */

function bindButtons() {

    allRole(
        "settingsButton"
    )
    .forEach(

        function (button) {

            button.addEventListener(

                "click",

                function (event) {

                    /*
                     * Klick nicht gleichzeitig als
                     * Kachel-Klick behandeln.
                     */

                    event.preventDefault();

                    event.stopPropagation();


                    const target =
                        Number(
                            currentData.settingsObjectID
                            ||
                            0
                        );


                    if (
                        target <= 0
                    ) {

                        button.disabled =
                            true;

                        button.title =
                            "Einstellungen-Ziel wurde nicht gefunden";

                        return;
                    }


                    /*
                     * Symcon HTML-SDK.
                     */

                    if (
                        typeof openObject
                        ===
                        "function"
                    ) {

                        openObject(
                            target
                        );

                        return;
                    }


                    /*
                     * Niemals still nichts tun.
                     */

                    button.disabled =
                        true;

                    button.title =
                        "openObject() ist in dieser Ansicht nicht verfügbar";
                }
            );
        }
    );
}


/* ============================================================
   DATEN ANZEIGEN
============================================================ */

function applyData() {

    const data =
        currentData
        ||
        {};


    const wp =
        data.wp
        ||
        {};


    const rooms =
        data.rooms
        ||
        {};


    const fbh =
        data.fbh
        ||
        {};


    const dhw =
        data.dhw
        ||
        {};


    const buffer =
        data.buffer
        ||
        {};


    const meteo =
        data.meteo
        ||
        {};


    const solcast =
        data.solcast
        ||
        {};


    /*
     * Betriebsart
     */

    setRoleText(
        "mode",
        wp.mode
        ||
        "—"
    );


    allRole(
        "modeDot"
    )
    .forEach(

        function (element) {

            element.className =
                "status-dot "
                +
                (
                    wp.modeCode
                    ||
                    "standby"
                );
        }
    );


    /*
     * Räume
     */

    setRoleText(
        "roomAverage",
        formatTemperature(
            rooms.average
        )
    );


    if (
        isNumber(
            rooms.minimum
        )
        &&
        isNumber(
            rooms.maximum
        )
    ) {

        setRoleText(

            "roomRange",

            rooms.minimum
                .toFixed(
                    1
                )
            +
            " / "
            +
            rooms.maximum
                .toFixed(
                    1
                )
            +
            " °C"
        );

    } else {

        setRoleText(
            "roomRange",
            "—"
        );
    }


    /*
     * FBH
     */

    if (
        isNumber(
            fbh.open
        )
        &&
        isNumber(
            fbh.total
        )
    ) {

        setRoleText(

            "valvesOpen",

            fbh.open
            +
            " / "
            +
            fbh.total
        );

    } else {

        setRoleText(
            "valvesOpen",
            "—"
        );
    }


    setRoleText(
        "demandAverage",
        formatPercent(
            fbh.demandAverage
        )
    );


    setRoleText(
        "demandMaximum",
        formatPercent(
            fbh.demandMaximum
        )
    );


    /*
     * Wärmepumpe
     */

    setRoleText(
        "outsideTemp",
        formatTemperature(
            wp.outside
        )
    );


    setRoleText(
        "flowTemp",
        formatTemperature(
            wp.flow
        )
    );


    setRoleText(
        "returnTemp",
        formatTemperature(
            wp.return
        )
    );


    setRoleText(
        "modulation",
        formatPercent(
            wp.modulation
        )
    );


    setRoleText(
        "wpPower",
        formatKW(
            wp.power
        )
    );


    setRoleText(
        "heatOutput",
        formatKW(
            wp.heatOutput
        )
    );


    setRoleText(

        "cop",

        isNumber(
            wp.cop
        )
            ?
            wp.cop
                .toFixed(
                    2
                )
            :
            "—"
    );


    /*
     * Speicher
     */

    setRoleText(
        "dhwTop",
        formatTemperature(
            dhw.top
        )
    );


    setRoleText(
        "dhwBottom",
        formatTemperature(
            dhw.bottom
        )
    );


    setRoleText(
        "bufferTop",
        formatTemperature(
            buffer.top
        )
    );


    setRoleText(
        "bufferMiddle",
        formatTemperature(
            buffer.middle
        )
    );


    setRoleText(
        "bufferBottom",
        formatTemperature(
            buffer.bottom
        )
    );


    /*
     * MeteoSchweiz
     */

    setRoleText(
        "meteoMaximum",
        formatTemperature(
            meteo.maximum
        )
    );


    setRoleText(
        "meteoMean",
        formatTemperature(
            meteo.mean
        )
    );


    setRoleText(
        "meteoMinimum",
        formatTemperature(
            meteo.minimum
        )
    );


    setRoleText(

        "meteoSolar",

        formatNumber(
            meteo.solar,
            2,
            " kWh/m²"
        )
    );


    /*
     * Solcast
     */

    setRoleText(

        "solcastEnergy",

        formatNumber(
            solcast.energyP50,
            1,
            " kWh"
        )
    );


    setRoleText(
        "solcastPeak",
        formatKW(
            solcast.peak
        )
    );


    setRoleText(
        "solcastPeakTime",
        formatTime(
            solcast.peakTime
        )
    );


    setRoleText(
        "solcastConfidence",
        formatPercent(
            solcast.confidence
        )
    );


    if (
        solcast.peakWindowStart > 0
        &&
        solcast.peakWindowEnd > 0
    ) {

        setRoleText(

            "solcastPeakWindow",

            formatTime(
                solcast.peakWindowStart
            )
            +
            " – "
            +
            formatTime(
                solcast.peakWindowEnd
            )
        );

    } else {

        setRoleText(
            "solcastPeakWindow",
            "—"
        );
    }


    /*
     * Letztes Update
     */

    setRoleText(

        "lastUpdate",

        "Aktualisiert "
        +
        formatTime(
            data.timestamp
        )
    );


    /*
     * Settings prüfen.
     */

    const settingsOK =
        (
            Number(
                data.settingsObjectID
                ||
                0
            )
            >
            0
        )
        &&
        (
            typeof openObject
            ===
            "function"
        );


    allRole(
        "settingsButton"
    )
    .forEach(

        function (button) {

            button.disabled =
                !settingsOK;


            button.title =
                settingsOK

                    ?

                    "WP Regelung Einstellungen öffnen"

                    :

                    "Einstellungen-Ziel nicht verfügbar";
        }
    );
}


/* ============================================================
   LIVE UPDATE
============================================================ */

function handleMessage(data) {

    if (
        typeof data
        ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }
    }


    if (
        !data
        ||
        typeof data
        !==
        "object"
    ) {

        return;
    }


    currentData =
        data;


    /*
     * Nur Werte im DOM ändern.
     *
     * Kein kompletter HTML-Neuaufbau.
     */

    applyData();
}


/* ============================================================
   RESIZE
============================================================ */

const resizeObserver =
    new ResizeObserver(

        function () {

            renderMode();
        }
    );


resizeObserver.observe(
    document.documentElement
);


/* ============================================================
   START
============================================================ */

window.addEventListener(

    "load",

    function () {

        /*
         * Compact oder Detail anhand
         * tatsächlicher Kachelfläche.
         */

        renderMode();


        /*
         * Initialdaten sind bereits eingebettet.
         */

        applyData();


        /*
         * Zusätzlich einmal Livewerte holen.
         */

        if (
            typeof requestAction
            ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );
        }
    }
);

</script>
