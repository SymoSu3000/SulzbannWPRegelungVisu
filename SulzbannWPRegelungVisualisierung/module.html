<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<script src="/icons.js"></script>

<style>

:root {
    color-scheme: light dark;

    --foreground:
        var(
            --content-color,
            #202124
        );

    --muted:
        color-mix(
            in srgb,
            var(--foreground) 62%,
            transparent
        );

    --card:
        color-mix(
            in srgb,
            var(--foreground) 7%,
            transparent
        );

    --soft:
        color-mix(
            in srgb,
            var(--foreground) 10%,
            transparent
        );

    --border:
        color-mix(
            in srgb,
            var(--foreground) 17%,
            transparent
        );

    --heating:#d97f2b;
    --cooling:#2e8ec8;
    --standby:#7e8b91;
    --fault:#d84a4a;
}


@media (prefers-color-scheme: dark) {

    :root {

        --foreground:
            var(
                --content-color,
                #f3f5f7
            );
    }
}


@media (prefers-color-scheme: light) {

    :root {

        --foreground:
            var(
                --content-color,
                #202124
            );
    }
}


* {
    box-sizing:border-box;
}


html,
body {
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

    color:var(--foreground);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


button {
    font:inherit;
    color:inherit;
}


#app {
    width:100%;
    height:100%;

    overflow:hidden;
}


/*
 * Symcon zeichnet den eigentlichen Kacheltitel selbst.
 */
.view-shell {
    width:100%;
    height:100%;

    padding:
        54px
        12px
        12px
        12px;
}


.compact {
    display:flex;

    flex-direction:column;

    gap:10px;

    min-height:0;
}


.compact-head {
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    min-height:40px;
}


.compact-mode {
    display:flex;

    align-items:center;

    gap:9px;

    min-width:0;
}


.status-dot {
    width:11px;
    height:11px;

    min-width:11px;

    border-radius:50%;

    background:var(--standby);
}


.status-dot.heating {
    background:var(--heating);
}


.status-dot.cooling {
    background:var(--cooling);
}


.status-dot.standby {
    background:var(--standby);
}


.status-dot.fault {
    background:var(--fault);
}


.label {
    font-size:13px;
    line-height:1.25;

    color:var(--muted);
}


.compact-mode-value {
    margin-top:2px;

    font-size:17px;
    line-height:1.2;

    font-weight:700;

    color:var(--foreground);
}


.actions {
    display:flex;

    align-items:center;

    gap:7px;

    flex-shrink:0;
}


.action-button {
    height:38px;

    padding:
        0
        12px;

    border:
        1px
        solid
        var(--border);

    border-radius:9px;

    background:var(--soft);

    color:var(--foreground);

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    cursor:pointer;

    white-space:nowrap;

    font-size:13px;

    font-weight:600;
}


.action-button:active {
    opacity:.72;
}


.action-button:disabled {
    opacity:.38;

    cursor:default;
}


.expand-button {
    width:38px;
    min-width:38px;

    padding:0;
}


.compact-grid {
    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:9px;

    min-height:0;
}


.card {
    background:var(--card);

    border:
        1px
        solid
        var(--border);

    border-radius:11px;

    min-width:0;
}


.compact-card {
    padding:
        10px
        11px;

    min-height:82px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}


.value {
    margin-top:4px;

    font-size:18px;
    line-height:1.2;

    font-weight:700;

    color:var(--foreground);
}


@media (max-width:700px) {

    .view-shell {
        padding:
            52px
            9px
            9px
            9px;
    }


    .label {
        font-size:12px;
    }


    .settings-text {
        display:none;
    }


    .settings-button {
        min-width:40px;

        padding:
            0
            10px;
    }
}


@media (max-width:420px) {

    .compact-grid {
        grid-template-columns:
            1fr
            1fr;

        gap:7px;
    }


    .compact-grid
    .compact-card:last-child {
        grid-column:1/-1;
    }


    .compact-card {
        min-height:68px;

        padding:
            8px
            9px;
    }


    .actions {
        gap:5px;
    }


    .action-button {
        height:36px;
    }


    .expand-button {
        width:36px;
        min-width:36px;
    }
}

</style>

</head>


<body>

<div id="app">


    <div class="view-shell compact">


        <div class="compact-head">


            <div class="compact-mode">

                <span
                    data-role="modeDot"
                    class="status-dot standby"
                ></span>


                <div>

                    <div class="label">
                        WP Master-Betriebsart
                    </div>


                    <div
                        class="compact-mode-value"
                        data-role="mode"
                    >
                        —
                    </div>

                </div>

            </div>


            <div class="actions">


                <button
                    data-role="grossButton"
                    class="action-button expand-button"
                    type="button"
                    aria-label="Grossansicht"
                    title="Grossansicht öffnen"
                >
                    ↗
                </button>


                <button
                    data-role="settingsButton"
                    class="action-button settings-button"
                    type="button"
                    aria-label="Einstellungen"
                >

                    <i class="fa-light fa-gear"></i>


                    <span class="settings-text">
                        Einstellungen
                    </span>

                </button>


            </div>

        </div>


        <div class="compact-grid">


            <div class="card compact-card">

                <div class="label">
                    Raumtemperatur
                </div>


                <div
                    class="value"
                    data-role="roomAverage"
                >
                    —
                </div>

            </div>


            <div class="card compact-card">

                <div class="label">
                    FBH Ventile offen
                </div>


                <div
                    class="value"
                    data-role="valvesOpen"
                >
                    —
                </div>

            </div>


            <div class="card compact-card">

                <div class="label">
                    Stellwert max.
                </div>


                <div
                    class="value"
                    data-role="demandMaximum"
                >
                    —
                </div>

            </div>


        </div>

    </div>


</div>


<script>

"use strict";


const INITIAL_DATA =
    __SBWRV_INITIAL_DATA__;


let currentData =
    (
        INITIAL_DATA
        &&
        typeof INITIAL_DATA === "object"
    )
        ?
        INITIAL_DATA
        :
        {};


/*
 * ============================================================
 * DOM
 * ============================================================
 */

function allRole(role) {

    return document.querySelectorAll(
        '[data-role="'
        +
        role
        +
        '"]'
    );
}


function setRoleText(
    role,
    value
) {

    allRole(
        role
    )
    .forEach(
        element => {

            if (
                element.textContent
                !==
                value
            ) {
                element.textContent =
                    value;
            }
        }
    );
}


/*
 * ============================================================
 * FORMAT
 * ============================================================
 */

function isNumber(value) {

    return (
        typeof value
        ===
        "number"
        &&
        Number.isFinite(value)
    );
}


function fmt(
    value,
    digits,
    suffix
) {

    return isNumber(value)
        ?
        value.toFixed(digits)
        +
        suffix
        :
        "—";
}


function fmtTemp(value) {

    return fmt(
        value,
        1,
        " °C"
    );
}


function fmtPercent(value) {

    return fmt(
        value,
        0,
        " %"
    );
}


/*
 * ============================================================
 * BUTTONS
 * ============================================================
 */

function bindButtons() {

    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    if (
                        typeof requestAction
                        ===
                        "function"
                    ) {

                        requestAction(
                            "OpenSettings",
                            true
                        );

                        return;
                    }


                    const target =
                        Number(
                            currentData.settingsObjectID
                            ||
                            0
                        );


                    if (
                        target > 0
                        &&
                        typeof openObject
                        ===
                        "function"
                    ) {

                        openObject(
                            target
                        );
                    }
                }
            );
        }
    );


    allRole(
        "grossButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    if (
                        typeof requestAction
                        ===
                        "function"
                    ) {

                        requestAction(
                            "OpenGross",
                            true
                        );
                    }
                }
            );
        }
    );
}


/*
 * ============================================================
 * LIVEWERTE
 * ============================================================
 */

function applyData() {

    const d =
        currentData
        ||
        {};


    const wp =
        d.wp
        ||
        {};


    const rooms =
        d.rooms
        ||
        {};


    const fbh =
        d.fbh
        ||
        {};


    setRoleText(
        "mode",
        wp.mode
        ||
        "—"
    );


    allRole(
        "modeDot"
    )
    .forEach(
        element => {

            element.className =
                "status-dot "
                +
                (
                    wp.modeCode
                    ||
                    "standby"
                );
        }
    );


    setRoleText(
        "roomAverage",
        fmtTemp(
            rooms.average
        )
    );


    setRoleText(
        "valvesOpen",
        (
            isNumber(
                fbh.open
            )
            &&
            isNumber(
                fbh.total
            )
        )
            ?
            fbh.open
            +
            " / "
            +
            fbh.total
            :
            "—"
    );


    setRoleText(
        "demandMaximum",
        fmtPercent(
            fbh.demandMaximum
        )
    );


    const settingsOK =
        Number(
            d.settingsObjectID
            ||
            0
        )
        >
        0;


    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.disabled =
                !settingsOK;
        }
    );
}


/*
 * ============================================================
 * SYMCON LIVE MESSAGE
 * ============================================================
 */

function handleMessage(data) {

    if (
        typeof data
        ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }
    }


    if (
        !data
        ||
        typeof data
        !==
        "object"
    ) {
        return;
    }


    currentData =
        data;


    applyData();
}


/*
 * ============================================================
 * START
 * ============================================================
 */

window.addEventListener(
    "load",
    () => {

        bindButtons();

        applyData();


        if (
            typeof requestAction
            ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );
        }
    }
);

</script>

</body>

</html>
