<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<script src="/icons.js"></script>

<style>

/* ============================================================
   THEME
============================================================ */

:root {

    color-scheme: light dark;

    --sb-bg: transparent;

    --sb-text:
        var(
            --content-color,
            #202124
        );

    --sb-muted:
        color-mix(
            in srgb,
            var(--sb-text) 62%,
            transparent
        );

    --sb-card:
        color-mix(
            in srgb,
            var(--sb-text) 7%,
            transparent
        );

    --sb-soft:
        color-mix(
            in srgb,
            var(--sb-text) 10%,
            transparent
        );

    --sb-border:
        color-mix(
            in srgb,
            var(--sb-text) 17%,
            transparent
        );

    --sb-accent:
        var(
            --accent-color,
            #00cdab
        );

    --sb-heating:#d97f2b;
    --sb-cooling:#2e8ec8;
    --sb-standby:#78909c;
    --sb-fault:#d84a4a;
}


@media (prefers-color-scheme:dark) {

    :root {

        --sb-text:
            var(
                --content-color,
                #f3f5f7
            );

        --sb-muted:
            color-mix(
                in srgb,
                var(--sb-text) 68%,
                transparent
            );

        --sb-card:
            rgba(
                255,
                255,
                255,
                .055
            );

        --sb-soft:
            rgba(
                255,
                255,
                255,
                .085
            );

        --sb-border:
            rgba(
                225,
                240,
                246,
                .18
            );

        --sb-heating:#ff9c48;
        --sb-cooling:#46a9e5;
        --sb-standby:#91a0a8;
        --sb-fault:#ef6262;
    }
}


* {
    box-sizing:border-box;
}


html,
body {

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:transparent;

    color:var(--sb-text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


button {

    font:inherit;

    color:inherit;
}


#app {

    width:100%;
    height:100%;

    overflow:hidden;
}


/* ============================================================
   SAFE AREA
============================================================ */

.view-shell {

    width:100%;
    height:100%;

    padding:
        54px
        12px
        12px
        12px;
}


/* ============================================================
   BASIS
============================================================ */

.status-dot {

    width:11px;
    height:11px;

    min-width:11px;

    border-radius:50%;

    background:var(--sb-standby);
}


.status-dot.heating {
    background:var(--sb-heating);
}


.status-dot.cooling {
    background:var(--sb-cooling);
}


.status-dot.standby {
    background:var(--sb-standby);
}


.status-dot.fault {
    background:var(--sb-fault);
}


.label {

    font-size:13px;
    line-height:1.25;

    color:var(--sb-muted);
}


.value {

    margin-top:4px;

    font-size:18px;
    line-height:1.2;

    font-weight:700;

    color:var(--sb-text);
}


.card {

    background:var(--sb-card);

    border:
        1px
        solid
        var(--sb-border);

    border-radius:11px;

    min-width:0;
}


/* ============================================================
   BUTTONS
============================================================ */

.actions {

    display:flex;

    align-items:center;

    gap:7px;
}


.action-button {

    height:38px;

    padding:
        0
        12px;

    border:
        1px
        solid
        var(--sb-border);

    border-radius:9px;

    background:var(--sb-soft);

    color:var(--sb-text);

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    cursor:pointer;

    white-space:nowrap;

    font-size:13px;
    font-weight:600;
}


.action-button:active {
    opacity:.72;
}


.action-button:disabled {

    opacity:.38;

    cursor:default;
}


.expand-button {

    width:38px;
    min-width:38px;

    padding:0;
}


/* ============================================================
   COMPACT
============================================================ */

.compact {

    display:flex;

    flex-direction:column;

    gap:10px;

    min-height:0;
}


.compact-head {

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    min-height:40px;
}


.compact-mode {

    display:flex;

    align-items:center;

    gap:9px;

    min-width:0;
}


.compact-mode-value {

    font-size:17px;

    font-weight:700;

    line-height:1.2;

    color:var(--sb-text);
}


.compact-grid {

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:9px;

    min-height:0;
}


.compact-card {

    padding:
        10px
        11px;

    min-height:82px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}


/* ============================================================
   DETAIL
============================================================ */

.detail {

    height:100%;

    overflow:auto;

    padding-right:2px;
}


.detail-head {

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:16px;

    margin-bottom:12px;

    min-height:42px;
}


.detail-mode {

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}


.detail-mode-value {

    font-size:21px;

    font-weight:700;

    line-height:1.2;
}


.summary-grid {

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );

    gap:10px;

    margin-bottom:10px;
}


.summary-card {

    padding:
        11px
        12px;

    min-height:76px;
}


.sections {

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:10px;
}


.section {

    padding:13px;
}


.section-title {

    margin-bottom:12px;

    font-size:15px;
    line-height:1.25;

    font-weight:700;

    color:var(--sb-text);
}


.data-grid {

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:
        14px
        24px;
}


.data-item {

    min-width:0;

    min-height:46px;
}


.peak-window {

    margin-top:14px;

    padding-top:12px;

    border-top:
        1px
        solid
        var(--sb-border);
}


.footer {

    margin-top:10px;

    text-align:right;

    font-size:12px;
    line-height:1.2;

    color:var(--sb-muted);
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media (max-width:700px) {

    .view-shell {

        padding:
            52px
            9px
            9px
            9px;
    }


    .label {
        font-size:12px;
    }


    .value {
        font-size:18px;
    }


    .summary-grid {

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
    }


    .sections {
        grid-template-columns:1fr;
    }


    .data-grid {

        gap:
            13px
            16px;
    }


    .settings-text {
        display:none;
    }


    .settings-button {

        min-width:40px;

        padding:
            0
            10px;
    }
}


@media (max-width:420px) {

    .compact-grid {

        grid-template-columns:
            1fr
            1fr;

        gap:7px;
    }


    .compact-grid
    .compact-card:last-child {

        grid-column:
            1
            /
            -1;
    }


    .compact-card {

        min-height:68px;

        padding:
            8px
            9px;
    }


    .summary-grid {
        gap:8px;
    }


    .section {
        padding:11px;
    }
}


@media (max-width:340px) {

    .data-grid {
        grid-template-columns:1fr;
    }
}

</style>

</head>


<body>


<div id="app"></div>



<!-- ============================================================
     COMPACT TEMPLATE
============================================================ -->

<template id="compactTemplate">

    <div class="view-shell compact">


        <div class="compact-head">


            <div class="compact-mode">

                <span
                    data-role="modeDot"
                    class="status-dot standby"
                ></span>


                <div>

                    <div class="label">
                        WP Master-Betriebsart
                    </div>


                    <div
                        class="compact-mode-value"
                        data-role="mode"
                    >
                        —
                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    data-role="grossButton"
                    class="action-button expand-button"
                    type="button"
                    title="Grossansicht"
                    aria-label="Grossansicht"
                >
                    ↗
                </button>


                <button
                    data-role="settingsButton"
                    class="action-button settings-button"
                    type="button"
                    aria-label="Einstellungen"
                >

                    <i class="fa-light fa-gear"></i>

                    <span class="settings-text">
                        Einstellungen
                    </span>

                </button>

            </div>

        </div>


        <div class="compact-grid">


            <div class="card compact-card">

                <div class="label">
                    Raumtemperatur
                </div>

                <div
                    class="value"
                    data-role="roomAverage"
                >
                    —
                </div>

            </div>


            <div class="card compact-card">

                <div class="label">
                    FBH Ventile offen
                </div>

                <div
                    class="value"
                    data-role="valvesOpen"
                >
                    —
                </div>

            </div>


            <div class="card compact-card">

                <div class="label">
                    Stellwert max.
                </div>

                <div
                    class="value"
                    data-role="demandMaximum"
                >
                    —
                </div>

            </div>


        </div>

    </div>

</template>



<!-- ============================================================
     DETAIL TEMPLATE
============================================================ -->

<template id="detailTemplate">

    <div class="view-shell detail">


        <div class="detail-head">


            <div class="detail-mode">

                <span
                    data-role="modeDot"
                    class="status-dot standby"
                ></span>


                <div>

                    <div class="label">
                        WP Master-Betriebsart
                    </div>


                    <div
                        class="detail-mode-value"
                        data-role="mode"
                    >
                        —
                    </div>

                </div>

            </div>


            <button
                data-role="settingsButton"
                class="action-button settings-button"
                type="button"
                aria-label="Einstellungen"
            >

                <i class="fa-light fa-gear"></i>

                <span class="settings-text">
                    Einstellungen
                </span>

            </button>

        </div>



        <div class="summary-grid">

            <div class="card summary-card">
                <div class="label">Raumtemperatur Mittel</div>
                <div class="value" data-role="roomAverage">—</div>
            </div>

            <div class="card summary-card">
                <div class="label">Raum Min. / Max.</div>
                <div class="value" data-role="roomRange">—</div>
            </div>

            <div class="card summary-card">
                <div class="label">FBH Ventile offen</div>
                <div class="value" data-role="valvesOpen">—</div>
            </div>

            <div class="card summary-card">
                <div class="label">FBH Stellwert max.</div>
                <div class="value" data-role="demandMaximum">—</div>
            </div>

        </div>



        <div class="sections">


            <div class="card section">

                <div class="section-title">
                    Wärmepumpe
                </div>

                <div class="data-grid">

                    <div class="data-item">
                        <div class="label">Aussentemperatur</div>
                        <div class="value" data-role="outsideTemp">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Vorlauf</div>
                        <div class="value" data-role="flowTemp">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Rücklauf</div>
                        <div class="value" data-role="returnTemp">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Verdichtermodulation</div>
                        <div class="value" data-role="modulation">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Leistungsaufnahme</div>
                        <div class="value" data-role="wpPower">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Wärmeleistung</div>
                        <div class="value" data-role="heatOutput">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">COP</div>
                        <div class="value" data-role="cop">—</div>
                    </div>

                </div>

            </div>



            <div class="card section">

                <div class="section-title">
                    Speicher
                </div>

                <div class="data-grid">

                    <div class="data-item">
                        <div class="label">Boiler oben</div>
                        <div class="value" data-role="dhwTop">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Boiler unten</div>
                        <div class="value" data-role="dhwBottom">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Puffer oben</div>
                        <div class="value" data-role="bufferTop">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Puffer Mitte</div>
                        <div class="value" data-role="bufferMiddle">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Puffer unten</div>
                        <div class="value" data-role="bufferBottom">—</div>
                    </div>

                </div>

            </div>



            <div class="card section">

                <div class="section-title">
                    Fussbodenheizung
                </div>

                <div class="data-grid">

                    <div class="data-item">
                        <div class="label">Ventile offen</div>
                        <div class="value" data-role="valvesOpen">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Stellwert Mittel</div>
                        <div class="value" data-role="demandAverage">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Stellwert Maximum</div>
                        <div class="value" data-role="demandMaximum">—</div>
                    </div>

                </div>

            </div>



            <div class="card section">

                <div class="section-title">
                    Prognose
                </div>

                <div class="data-grid">

                    <div class="data-item">
                        <div class="label">Morgen Maximum</div>
                        <div class="value" data-role="meteoMaximum">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Morgen Mittel</div>
                        <div class="value" data-role="meteoMean">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Morgen Minimum</div>
                        <div class="value" data-role="meteoMinimum">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Globalstrahlung</div>
                        <div class="value" data-role="meteoSolar">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Solcast P50 0–24 h</div>
                        <div class="value" data-role="solcastEnergy">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">PV Peak</div>
                        <div class="value" data-role="solcastPeak">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Peak Zeitpunkt</div>
                        <div class="value" data-role="solcastPeakTime">—</div>
                    </div>

                    <div class="data-item">
                        <div class="label">Vertrauen</div>
                        <div class="value" data-role="solcastConfidence">—</div>
                    </div>

                </div>


                <div class="peak-window">

                    <div class="label">
                        Peakfenster
                    </div>

                    <div
                        class="value"
                        data-role="solcastPeakWindow"
                    >
                        —
                    </div>

                </div>

            </div>


        </div>


        <div
            class="footer"
            data-role="lastUpdate"
        >
            —
        </div>


    </div>

</template>



<script>

"use strict";


const INITIAL_DATA =
    __SBWRV_INITIAL_DATA__;


let currentData =
    (
        INITIAL_DATA
        &&
        typeof INITIAL_DATA === "object"
    )
        ?
        INITIAL_DATA
        :
        {};


/*
 * Wir zeigen im HTML-SDK selbst Compact.
 *
 * Die funktionierende Grossansicht dieses Rücksetzstandes
 * wird über WPRegelungGross geöffnet.
 */
const currentMode =
    "compact";


/* ============================================================
   HELPERS
============================================================ */

function allRole(role) {

    return document.querySelectorAll(
        '[data-role="'
        +
        role
        +
        '"]'
    );
}


function setRoleText(
    role,
    value
) {

    allRole(
        role
    )
    .forEach(
        element => {

            if (
                element.textContent
                !==
                value
            ) {
                element.textContent =
                    value;
            }
        }
    );
}


function isNumber(value) {

    return (
        typeof value === "number"
        &&
        Number.isFinite(value)
    );
}


function fmt(
    value,
    digits,
    suffix
) {

    return isNumber(value)
        ?
        value.toFixed(digits)
        +
        suffix
        :
        "—";
}


function fmtTemp(value) {

    return fmt(
        value,
        1,
        " °C"
    );
}


function fmtKW(value) {

    return fmt(
        value,
        2,
        " kW"
    );
}


function fmtPercent(value) {

    return fmt(
        value,
        0,
        " %"
    );
}


function fmtTime(timestamp) {

    if (
        !timestamp
        ||
        timestamp <= 0
    ) {
        return "—";
    }


    const d =
        new Date(
            timestamp
            *
            1000
        );


    if (
        Number.isNaN(
            d.getTime()
        )
    ) {
        return "—";
    }


    return d.toLocaleTimeString(
        "de-CH",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* ============================================================
   RENDER COMPACT
============================================================ */

function renderCompact() {

    const app =
        document.getElementById(
            "app"
        );


    const tpl =
        document.getElementById(
            "compactTemplate"
        );


    app.innerHTML =
        "";


    app.appendChild(
        tpl.content.cloneNode(
            true
        )
    );


    bindButtons();

    applyData();
}


/* ============================================================
   BUTTONS
============================================================ */

function bindButtons() {

    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    const target =
                        Number(
                            currentData.settingsObjectID
                            ||
                            0
                        );


                    if (
                        target <= 0
                    ) {

                        button.disabled =
                            true;

                        button.title =
                            "Einstellungen-Ziel wurde nicht gefunden";

                        return;
                    }


                    /*
                     * Bestätigter Primärweg.
                     */
                    if (
                        typeof requestAction
                        ===
                        "function"
                    ) {

                        requestAction(
                            "OpenSettings",
                            true
                        );

                        return;
                    }


                    /*
                     * Fallback.
                     */
                    if (
                        typeof openObject
                        ===
                        "function"
                    ) {

                        openObject(
                            target
                        );

                        return;
                    }


                    button.disabled =
                        true;
                }
            );
        }
    );


    allRole(
        "grossButton"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    event.stopPropagation();


                    if (
                        typeof requestAction
                        ===
                        "function"
                    ) {

                        requestAction(
                            "OpenGross",
                            true
                        );
                    }
                }
            );
        }
    );
}


/* ============================================================
   APPLY DATA
============================================================ */

function applyData() {

    const d =
        currentData
        ||
        {};


    const wp =
        d.wp
        ||
        {};


    const rooms =
        d.rooms
        ||
        {};


    const fbh =
        d.fbh
        ||
        {};


    setRoleText(
        "mode",
        wp.mode
        ||
        "—"
    );


    allRole(
        "modeDot"
    )
    .forEach(
        element => {

            element.className =
                "status-dot "
                +
                (
                    wp.modeCode
                    ||
                    "standby"
                );
        }
    );


    setRoleText(
        "roomAverage",
        fmtTemp(
            rooms.average
        )
    );


    setRoleText(
        "roomRange",
        (
            isNumber(
                rooms.minimum
            )
            &&
            isNumber(
                rooms.maximum
            )
        )
            ?
            rooms.minimum.toFixed(1)
            +
            " / "
            +
            rooms.maximum.toFixed(1)
            +
            " °C"
            :
            "—"
    );


    setRoleText(
        "valvesOpen",
        (
            isNumber(
                fbh.open
            )
            &&
            isNumber(
                fbh.total
            )
        )
            ?
            fbh.open
            +
            " / "
            +
            fbh.total
            :
            "—"
    );


    setRoleText(
        "demandAverage",
        fmtPercent(
            fbh.demandAverage
        )
    );


    setRoleText(
        "demandMaximum",
        fmtPercent(
            fbh.demandMaximum
        )
    );


    const settingsOK =
        Number(
            d.settingsObjectID
            ||
            0
        )
        >
        0;


    allRole(
        "settingsButton"
    )
    .forEach(
        button => {

            button.disabled =
                !settingsOK;


            button.title =
                settingsOK
                    ?
                    "WP Regelung Einstellungen öffnen"
                    :
                    "Einstellungen-Ziel nicht verfügbar";
        }
    );
}


/* ============================================================
   LIVE MESSAGE
============================================================ */

function handleMessage(data) {

    if (
        typeof data
        ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }
    }


    if (
        !data
        ||
        typeof data
        !==
        "object"
    ) {
        return;
    }


    currentData =
        data;


    applyData();
}


/* ============================================================
   START
============================================================ */

window.addEventListener(
    "load",
    () => {

        renderCompact();


        if (
            typeof requestAction
            ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );
        }
    }
);

</script>

</body>

</html>
