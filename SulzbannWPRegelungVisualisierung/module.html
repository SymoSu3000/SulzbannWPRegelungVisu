<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="/icons.js"></script>
<style>
:root{
    --sb-bg:#ffffff;
    --sb-text:#14181b;
    --sb-muted:#64727a;
    --sb-card:#f3f6f7;
    --sb-soft:#eaf0f2;
    --sb-border:rgba(35,55,65,.18);
    --sb-accent:var(--accent-color,#00cdab);
    --sb-heating:#d97f2b;
    --sb-cooling:#2e8ec8;
    --sb-standby:#7e8b91;
    --sb-fault:#d84a4a;
}

html[data-sb-theme="dark"]{
    --sb-bg:#132f3b;
    --sb-text:#ffffff;
    --sb-muted:#b7c6cd;
    --sb-card:#183946;
    --sb-soft:#244552;
    --sb-border:rgba(225,240,246,.18);
    --sb-heating:#ff9c48;
    --sb-cooling:#46a9e5;
    --sb-standby:#91a0a8;
    --sb-fault:#ef6262;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--sb-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button{font:inherit;color:inherit}
#app{width:100%;height:100%;overflow:hidden}

/* Symcon zeichnet den Kacheltitel selbst. Diese Safe-Area bleibt frei. */
.view-shell{width:100%;height:100%;padding:54px 12px 12px 12px}

.status-dot{width:11px;height:11px;min-width:11px;border-radius:50%;background:var(--sb-standby)}
.status-dot.heating{background:var(--sb-heating)}
.status-dot.cooling{background:var(--sb-cooling)}
.status-dot.standby{background:var(--sb-standby)}
.status-dot.fault{background:var(--sb-fault)}

.label{font-size:13px;line-height:1.25;color:var(--sb-muted)}
.value{font-size:18px;line-height:1.2;font-weight:700;color:var(--sb-text);margin-top:4px}

.settings-button{height:38px;padding:0 12px;border:1px solid var(--sb-border);border-radius:9px;background:var(--sb-soft);color:var(--sb-text);display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}
.settings-button:active{opacity:.72}
.settings-button:disabled{opacity:.38;cursor:default}

/* COMPACT */
.compact{display:flex;flex-direction:column;gap:10px;min-height:0}
.compact-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.compact-mode{display:flex;align-items:center;gap:9px;min-width:0}
.compact-mode-value{font-size:17px;font-weight:700;line-height:1.2;color:var(--sb-text)}
.compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;min-height:0}
.card{background:var(--sb-card);border:1px solid var(--sb-border);border-radius:11px;min-width:0}
.compact-card{padding:10px 11px;min-height:82px;display:flex;flex-direction:column;justify-content:center}

/* DETAIL */
.detail{height:100%;overflow:auto;padding-right:2px}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px;min-height:42px}
.detail-mode{display:flex;align-items:center;gap:10px;min-width:0}
.detail-mode-value{font-size:21px;font-weight:700;line-height:1.2}
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.summary-card{padding:11px 12px;min-height:76px}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.section{padding:13px}
.section-title{font-size:15px;line-height:1.25;font-weight:700;color:var(--sb-text);margin-bottom:12px}
.data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.data-item{min-width:0;min-height:46px}
.peak-window{margin-top:14px;padding-top:12px;border-top:1px solid var(--sb-border)}
.footer{margin-top:10px;text-align:right;font-size:12px;line-height:1.2;color:var(--sb-muted)}

@media(max-width:700px){
    .view-shell{padding:52px 9px 9px 9px}
    .label{font-size:12px}
    .value{font-size:18px}
    .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sections{grid-template-columns:1fr}
    .data-grid{gap:13px 16px}
    .settings-text{display:none}
    .settings-button{min-width:40px;padding:0 10px}
}
@media(max-width:420px){
    .compact-grid{grid-template-columns:1fr 1fr;gap:7px}
    .compact-grid .compact-card:last-child{grid-column:1/-1}
    .compact-card{min-height:68px;padding:8px 9px}
    .summary-grid{gap:8px}
    .section{padding:11px}
}
@media(max-width:340px){
    .data-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>

<template id="compactTemplate">
    <div class="view-shell compact">
        <div class="compact-head">
            <div class="compact-mode">
                <span data-role="modeDot" class="status-dot standby"></span>
                <div>
                    <div class="label">WP Master-Betriebsart</div>
                    <div class="compact-mode-value" data-role="mode">—</div>
                </div>
            </div>
            <button data-role="settingsButton" class="settings-button" type="button" aria-label="Einstellungen">
                <i class="fa-light fa-gear"></i><span class="settings-text">Einstellungen</span>
            </button>
        </div>
        <div class="compact-grid">
            <div class="card compact-card"><div class="label">Raumtemperatur</div><div class="value" data-role="roomAverage">—</div></div>
            <div class="card compact-card"><div class="label">FBH Ventile offen</div><div class="value" data-role="valvesOpen">—</div></div>
            <div class="card compact-card"><div class="label">Stellwert max.</div><div class="value" data-role="demandMaximum">—</div></div>
        </div>
    </div>
</template>

<template id="detailTemplate">
    <div class="view-shell detail">
        <div class="detail-head">
            <div class="detail-mode">
                <span data-role="modeDot" class="status-dot standby"></span>
                <div>
                    <div class="label">WP Master-Betriebsart</div>
                    <div class="detail-mode-value" data-role="mode">—</div>
                </div>
            </div>
            <button data-role="settingsButton" class="settings-button" type="button" aria-label="Einstellungen">
                <i class="fa-light fa-gear"></i><span class="settings-text">Einstellungen</span>
            </button>
        </div>

        <div class="summary-grid">
            <div class="card summary-card"><div class="label">Raumtemperatur Mittel</div><div class="value" data-role="roomAverage">—</div></div>
            <div class="card summary-card"><div class="label">Raum Min. / Max.</div><div class="value" data-role="roomRange">—</div></div>
            <div class="card summary-card"><div class="label">FBH Ventile offen</div><div class="value" data-role="valvesOpen">—</div></div>
            <div class="card summary-card"><div class="label">FBH Stellwert max.</div><div class="value" data-role="demandMaximum">—</div></div>
        </div>

        <div class="sections">
            <div class="card section">
                <div class="section-title">Wärmepumpe</div>
                <div class="data-grid">
                    <div class="data-item"><div class="label">Aussentemperatur</div><div class="value" data-role="outsideTemp">—</div></div>
                    <div class="data-item"><div class="label">Vorlauf</div><div class="value" data-role="flowTemp">—</div></div>
                    <div class="data-item"><div class="label">Rücklauf</div><div class="value" data-role="returnTemp">—</div></div>
                    <div class="data-item"><div class="label">Verdichtermodulation</div><div class="value" data-role="modulation">—</div></div>
                    <div class="data-item"><div class="label">Leistungsaufnahme</div><div class="value" data-role="wpPower">—</div></div>
                    <div class="data-item"><div class="label">Wärmeleistung</div><div class="value" data-role="heatOutput">—</div></div>
                    <div class="data-item"><div class="label">COP</div><div class="value" data-role="cop">—</div></div>
                </div>
            </div>

            <div class="card section">
                <div class="section-title">Speicher</div>
                <div class="data-grid">
                    <div class="data-item"><div class="label">Boiler oben</div><div class="value" data-role="dhwTop">—</div></div>
                    <div class="data-item"><div class="label">Boiler unten</div><div class="value" data-role="dhwBottom">—</div></div>
                    <div class="data-item"><div class="label">Puffer oben</div><div class="value" data-role="bufferTop">—</div></div>
                    <div class="data-item"><div class="label">Puffer Mitte</div><div class="value" data-role="bufferMiddle">—</div></div>
                    <div class="data-item"><div class="label">Puffer unten</div><div class="value" data-role="bufferBottom">—</div></div>
                </div>
            </div>

            <div class="card section">
                <div class="section-title">Fussbodenheizung</div>
                <div class="data-grid">
                    <div class="data-item"><div class="label">Ventile offen</div><div class="value" data-role="valvesOpen">—</div></div>
                    <div class="data-item"><div class="label">Stellwert Mittel</div><div class="value" data-role="demandAverage">—</div></div>
                    <div class="data-item"><div class="label">Stellwert Maximum</div><div class="value" data-role="demandMaximum">—</div></div>
                </div>
            </div>

            <div class="card section">
                <div class="section-title">Prognose</div>
                <div class="data-grid">
                    <div class="data-item"><div class="label">Morgen Maximum</div><div class="value" data-role="meteoMaximum">—</div></div>
                    <div class="data-item"><div class="label">Morgen Mittel</div><div class="value" data-role="meteoMean">—</div></div>
                    <div class="data-item"><div class="label">Morgen Minimum</div><div class="value" data-role="meteoMinimum">—</div></div>
                    <div class="data-item"><div class="label">Globalstrahlung</div><div class="value" data-role="meteoSolar">—</div></div>
                    <div class="data-item"><div class="label">Solcast P50 0–24 h</div><div class="value" data-role="solcastEnergy">—</div></div>
                    <div class="data-item"><div class="label">PV Peak</div><div class="value" data-role="solcastPeak">—</div></div>
                    <div class="data-item"><div class="label">Peak Zeitpunkt</div><div class="value" data-role="solcastPeakTime">—</div></div>
                    <div class="data-item"><div class="label">Vertrauen</div><div class="value" data-role="solcastConfidence">—</div></div>
                </div>
                <div class="peak-window"><div class="label">Peakfenster</div><div class="value" data-role="solcastPeakWindow">—</div></div>
            </div>
        </div>

        <div class="footer" data-role="lastUpdate">—</div>
    </div>
</template>

<script>
"use strict";

const INITIAL_DATA = __SBWRV_INITIAL_DATA__;
let currentData = (INITIAL_DATA && typeof INITIAL_DATA === "object") ? INITIAL_DATA : {};
let currentMode = null;

function allRole(role){return document.querySelectorAll('[data-role="'+role+'"]')}
function setRoleText(role,value){allRole(role).forEach(el=>{if(el.textContent!==value)el.textContent=value})}
function isNumber(value){return typeof value==="number"&&Number.isFinite(value)}
function fmt(value,digits,suffix){return isNumber(value)?value.toFixed(digits)+suffix:"—"}
function fmtTemp(value){return fmt(value,1," °C")}
function fmtKW(value){return fmt(value,2," kW")}
function fmtPercent(value){return fmt(value,0," %")}
function fmtTime(timestamp){if(!timestamp||timestamp<=0)return "—";const d=new Date(timestamp*1000);return Number.isNaN(d.getTime())?"—":d.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})}

function determineMode(){
    const w=document.documentElement.clientWidth;
    const h=document.documentElement.clientHeight;
    const area=w*h;

    /*
     * Reale Referenz aus Symcon:
     * geöffnete Ansicht ca. 630 x 445 px muss DETAIL sein.
     * Kleine/kurze Kacheln bleiben COMPACT.
     * Mobile Voll-/Grossansicht wird durch die grosse Höhe ebenfalls DETAIL.
     */
    if(h>=320 && area>=190000){return "detail"}
    return "compact";
}

function renderMode(){
    const mode=determineMode();
    if(mode===currentMode)return;
    currentMode=mode;
    const app=document.getElementById("app");
    const tpl=document.getElementById(mode==="detail"?"detailTemplate":"compactTemplate");
    app.innerHTML="";
    app.appendChild(tpl.content.cloneNode(true));
    bindButtons();
    applyData();
}

function bindButtons(){
    allRole("settingsButton").forEach(button=>{
        button.addEventListener("click",event=>{
            event.preventDefault();
            event.stopPropagation();

            const target=Number(currentData.settingsObjectID||0);

            if(target<=0){
                button.disabled=true;
                button.title="Einstellungen-Ziel wurde nicht gefunden";
                return;
            }

            /*
             * Primärweg:
             * HTML-SDK -> RequestAction -> PHP -> VISU_OpenObject().
             * Damit sind wir nicht davon abhängig, ob openObject()
             * im jeweiligen Web-/App-Kontext direkt verfügbar ist.
             */
            if(typeof requestAction==="function"){
                requestAction("OpenSettings",true);
                return;
            }

            /* Zweite Route als Fallback. */
            if(typeof openObject==="function"){
                openObject(target);
                return;
            }

            button.disabled=true;
            button.title="Symcon-Navigation in dieser Ansicht nicht verfügbar";
        });
    });
}

function applyData(){
    const d=currentData||{};
    const wp=d.wp||{};
    const rooms=d.rooms||{};
    const fbh=d.fbh||{};
    const dhw=d.dhw||{};
    const buffer=d.buffer||{};
    const meteo=d.meteo||{};
    const solcast=d.solcast||{};

    setRoleText("mode",wp.mode||"—");
    allRole("modeDot").forEach(el=>{el.className="status-dot "+(wp.modeCode||"standby")});

    setRoleText("roomAverage",fmtTemp(rooms.average));
    setRoleText("roomRange",isNumber(rooms.minimum)&&isNumber(rooms.maximum)?rooms.minimum.toFixed(1)+" / "+rooms.maximum.toFixed(1)+" °C":"—");
    setRoleText("valvesOpen",isNumber(fbh.open)&&isNumber(fbh.total)?fbh.open+" / "+fbh.total:"—");
    setRoleText("demandAverage",fmtPercent(fbh.demandAverage));
    setRoleText("demandMaximum",fmtPercent(fbh.demandMaximum));

    setRoleText("outsideTemp",fmtTemp(wp.outside));
    setRoleText("flowTemp",fmtTemp(wp.flow));
    setRoleText("returnTemp",fmtTemp(wp.return));
    setRoleText("modulation",fmtPercent(wp.modulation));
    setRoleText("wpPower",fmtKW(wp.power));
    setRoleText("heatOutput",fmtKW(wp.heatOutput));
    setRoleText("cop",isNumber(wp.cop)?wp.cop.toFixed(2):"—");

    setRoleText("dhwTop",fmtTemp(dhw.top));
    setRoleText("dhwBottom",fmtTemp(dhw.bottom));
    setRoleText("bufferTop",fmtTemp(buffer.top));
    setRoleText("bufferMiddle",fmtTemp(buffer.middle));
    setRoleText("bufferBottom",fmtTemp(buffer.bottom));

    setRoleText("meteoMaximum",fmtTemp(meteo.maximum));
    setRoleText("meteoMean",fmtTemp(meteo.mean));
    setRoleText("meteoMinimum",fmtTemp(meteo.minimum));
    setRoleText("meteoSolar",fmt(meteo.solar,2," kWh/m²"));

    setRoleText("solcastEnergy",fmt(solcast.energyP50,1," kWh"));
    setRoleText("solcastPeak",fmtKW(solcast.peak));
    setRoleText("solcastPeakTime",fmtTime(solcast.peakTime));
    setRoleText("solcastConfidence",fmtPercent(solcast.confidence));
    setRoleText("solcastPeakWindow",solcast.peakWindowStart>0&&solcast.peakWindowEnd>0?fmtTime(solcast.peakWindowStart)+" – "+fmtTime(solcast.peakWindowEnd):"—");
    setRoleText("lastUpdate","Aktualisiert "+fmtTime(d.timestamp));

    const settingsOK=Number(d.settingsObjectID||0)>0 && (typeof requestAction==="function" || typeof openObject==="function");
    allRole("settingsButton").forEach(button=>{
        button.disabled=!settingsOK;
        button.title=settingsOK?"WP Regelung Einstellungen öffnen":"Einstellungen-Ziel nicht verfügbar";
    });
}

function parseRgb(value){
    if(!value || value==="transparent")return null;
    const m=value.match(/rgba?\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)/i);
    if(!m)return null;
    return [Number(m[1]),Number(m[2]),Number(m[3])];
}

function luminance(rgb){
    if(!rgb)return null;
    const [r,g,b]=rgb.map(v=>v/255);
    return .2126*r+.7152*g+.0722*b;
}

function getParentTileBackground(){
    try{
        let el=window.frameElement;
        let steps=0;
        while(el && steps<10){
            const cs=window.parent.getComputedStyle(el);
            const bg=parseRgb(cs.backgroundColor);
            if(bg && luminance(bg)!==null)return bg;
            el=el.parentElement;
            steps++;
        }
    }catch(e){}
    return null;
}

function detectSymconTheme(){
    /*
     * 1. Priorität: echter Hintergrund der übergeordneten Symcon-Kachel.
     *    Das ist entscheidend für Desktop, weil die HTML-SDK CSS-Variablen
     *    dort bei dir nicht zuverlässig das aktive Visu-Theme widerspiegeln.
     */
    const parentBg=getParentTileBackground();
    const parentLum=luminance(parentBg);
    if(parentLum!==null){
        return parentLum<0.50?"dark":"light";
    }

    /*
     * 2. Fallback: Symcon --content-color auswerten.
     *    Helle Schrift deutet auf dunkles Visu-Theme.
     */
    const rootStyle=getComputedStyle(document.documentElement);
    const contentColor=parseRgb(rootStyle.getPropertyValue("--content-color").trim());
    const contentLum=luminance(contentColor);
    if(contentLum!==null){
        return contentLum>0.60?"dark":"light";
    }

    /*
     * 3. Letzter Fallback. Nicht primär verwenden, weil OS/Browser-Theme
     *    von Symcon abweichen kann.
     */
    if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
        return "dark";
    }

    return "light";
}

function syncTheme(){
    const theme=detectSymconTheme();
    if(document.documentElement.dataset.sbTheme!==theme){
        document.documentElement.dataset.sbTheme=theme;
    }
}

function handleMessage(data){
    if(typeof data==="string"){
        try{data=JSON.parse(data)}catch(e){return}
    }
    if(!data||typeof data!=="object")return;
    currentData=data;
    applyData();
}

const resizeObserver=new ResizeObserver(()=>{syncTheme();renderMode()});
resizeObserver.observe(document.documentElement);

window.addEventListener("load",()=>{
    syncTheme();
    renderMode();
    applyData();
    if(typeof requestAction==="function")requestAction("Refresh",true);

    /* Theme-Wechsel in Symcon auch ohne kompletten Reload nachziehen. */
    window.setInterval(syncTheme,1500);
});
</script>
</body>
</html>
