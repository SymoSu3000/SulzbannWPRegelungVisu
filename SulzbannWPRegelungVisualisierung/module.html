<style>

/* ============================================================
   THEME
============================================================ */

/*
 * Standard = HELL.
 *
 * JavaScript setzt bei dunklem Symcon-Layout:
 *
 * <html data-sb-theme="dark">
 */

:root {

    --sb-bg:
        #ffffff;

    --sb-text:
        #14181b;

    --sb-muted:
        #64727a;

    --sb-card:
        #f3f6f7;

    --sb-soft:
        #eaf0f2;

    --sb-border:
        rgba(
            35,
            55,
            65,
            0.18
        );

    --sb-accent:
        var(
            --accent-color,
            #00cdab
        );

    --sb-heating:
        #d97f2b;

    --sb-cooling:
        #2e8ec8;

    --sb-standby:
        #7e8b91;

    --sb-fault:
        #d84a4a;
}


html[data-sb-theme="dark"] {

    --sb-bg:
        #132f3b;

    --sb-text:
        #ffffff;

    --sb-muted:
        #b7c6cd;

    --sb-card:
        #183946;

    --sb-soft:
        #244552;

    --sb-border:
        rgba(
            225,
            240,
            246,
            0.18
        );

    --sb-heating:
        #ff9c48;

    --sb-cooling:
        #46a9e5;

    --sb-standby:
        #91a0a8;

    --sb-fault:
        #ef6262;
}


/* ============================================================
   BASIS
============================================================ */

* {
    box-sizing:
        border-box;
}


html,
body {

    margin:
        0;

    padding:
        0;

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;

    background:
        transparent;

    color:
        var(--sb-text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


button {

    font:
        inherit;

    color:
        inherit;
}


#app {

    width:
        100%;

    height:
        100%;

    overflow:
        hidden;
}


/* ============================================================
   KACHELTITEL SAFE AREA
============================================================ */

.view-shell {

    width:
        100%;

    height:
        100%;

    padding:
        54px 12px 12px 12px;
}


/* ============================================================
   STATUS
============================================================ */

.status-dot {

    width:
        11px;

    height:
        11px;

    min-width:
        11px;

    border-radius:
        50%;

    background:
        var(--sb-standby);
}


.status-dot.heating {
    background:
        var(--sb-heating);
}


.status-dot.cooling {
    background:
        var(--sb-cooling);
}


.status-dot.standby {
    background:
        var(--sb-standby);
}


.status-dot.fault {
    background:
        var(--sb-fault);
}


/* ============================================================
   TYPOGRAFIE
============================================================ */

.label {

    font-size:
        13px;

    line-height:
        1.25;

    color:
        var(--sb-muted);
}


.value {

    font-size:
        18px;

    line-height:
        1.20;

    font-weight:
        700;

    color:
        var(--sb-text);

    margin-top:
        4px;
}


/* ============================================================
   EINSTELLUNGEN
============================================================ */

.settings-button {

    height:
        38px;

    padding:
        0 12px;

    border:
        1px solid
        var(--sb-border);

    border-radius:
        9px;

    background:
        var(--sb-soft);

    color:
        var(--sb-text);

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        7px;

    cursor:
        pointer;

    white-space:
        nowrap;

    font-size:
        13px;

    font-weight:
        600;
}


.settings-button:active {
    opacity:
        0.72;
}


.settings-button:disabled {

    opacity:
        0.38;

    cursor:
        default;
}


/* ============================================================
   COMPACT
============================================================ */

.compact {

    display:
        flex;

    flex-direction:
        column;

    gap:
        10px;

    min-height:
        0;
}


.compact-head {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        12px;

    min-height:
        40px;
}


.compact-mode {

    align-items:
        center;

    gap:

}


.compact-mode-value {

.compact-grid {

.card {

.summary-grid {

    gap:

        10px;

        76px;

.sections {

        grid;

    grid-template-columns:
        repeat(
            2,

    gap:

.section {

.data-grid {

<script>

"use strict";


/* ============================================================
   INITIALDATEN
============================================================ */

const INITIAL_DATA =
    __SBWRV_INITIAL_DATA__;


let currentData =
    (
        INITIAL_DATA
        &&
        typeof INITIAL_DATA
        ===
        "object"
    )
        ?
        INITIAL_DATA
        :
        {};


let currentMode =
    null;


/* ============================================================
   DOM
============================================================ */

function allRole(role) {

    return document.querySelectorAll(
        '[data-role="'
        +
        role
        +
        '"]'
    );
}


function setRoleText(
    role,
    value
) {

    allRole(
        role
    )
    .forEach(

        function (element) {

            if (
                element.textContent
                !==
                value
            ) {

                element.textContent =
                    value;
            }

        }
    );
}


/* ============================================================
   FORMATIERUNG
============================================================ */

function isNumber(value) {

    return (
        typeof value
        ===
        "number"
        &&
        Number.isFinite(
            value
        )
    );
}


function formatNumber(
    value,
    digits,
    suffix
) {

    if (
        !isNumber(
            value
        )
    ) {

        return "—";
    }


    return (
        value.toFixed(
            digits
        )
        +
        suffix
    );
}


function formatTemperature(
    value
) {

    return formatNumber(
        value,
        1,
        " °C"
    );
}


function formatKW(
    value
) {

    return formatNumber(
        value,
        2,
        " kW"
    );
}


function formatPercent(
    value
) {

    return formatNumber(
        value,
        0,
        " %"
    );
}


function formatTime(
    timestamp
) {

    if (
        !timestamp
        ||
        timestamp <= 0
    ) {

        return "—";
    }


    const date =
        new Date(
            timestamp * 1000
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "—";
    }


    return date.toLocaleTimeString(
        "de-CH",
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );
}


/* ============================================================
   COMPACT / DETAIL
============================================================ */

function determineMode() {

    const width =
        document.documentElement
            .clientWidth;


    const height =
        document.documentElement
            .clientHeight;


    const area =
        width
        *
        height;


    /*
     * Geöffnete ca. 630 x 445 px Ansicht = DETAIL.
     *
     * Kleine Kachel = COMPACT.
     */

    if (
        height >= 320
        &&
        area >= 190000
    ) {

        return "detail";
    }


    return "compact";
}


function renderMode() {

    const mode =
        determineMode();


    if (
        mode
        ===
        currentMode
    ) {

        return;
    }


    currentMode =
        mode;


    const app =
        document.getElementById(
            "app"
        );


    const template =
        document.getElementById(

            mode === "detail"

                ?

                "detailTemplate"

                :

                "compactTemplate"
        );


    app.innerHTML =
        "";


    app.appendChild(
        template.content
            .cloneNode(
                true
            )
    );


    bindButtons();

    applyData();
}


/* ============================================================
   EINSTELLUNGEN
============================================================ */

function bindButtons() {

    allRole(
        "settingsButton"
    )
    .forEach(

        function (button) {

            button.addEventListener(

                "click",

                function (event) {

                    event.preventDefault();

                    event.stopPropagation();


                    const target =
                        Number(
                            currentData.settingsObjectID
                            ||
                            0
                        );


                    if (
                        target <= 0
                    ) {

                        button.disabled =
                            true;

                        button.title =
                            "Einstellungen-Ziel wurde nicht gefunden";

                        return;
                    }


                    /*
                     * PRIMÄR:
                     *
                     * HTML SDK -> PHP Modul.
                     *
                     * Dort öffnet VISU_OpenObject()
                     * die Kategorie.
                     */

                    if (
                        typeof requestAction
                        ===
                        "function"
                    ) {

                        requestAction(
                            "OpenSettings",
                            true
                        );

                        return;
                    }


                    /*
                     * FALLBACK:
                     *
                     * Direkte HTML-SDK Funktion.
                     */

                    if (
                        typeof openObject
                        ===
                        "function"
                    ) {

                        openObject(
                            target
                        );

                        return;
                    }


                    button.disabled =
                        true;

                    button.title =
                        "Symcon-Navigation in dieser Ansicht nicht verfügbar";
                }
            );
        }
    );
}

/* ============================================================
   THEME
============================================================ */

/*
 * Hintergrundfarbe in RGB zerlegen.
 */

function parseRgb(value) {

    if (
        !value
        ||
        value ===
        "transparent"
    ) {

        return null;
    }


    const match =
        value.match(
            /rgba?\(\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)/i
        );


    if (!match) {

        return null;
    }


    return [

        Number(
            match[1]
        ),

        Number(
            match[2]
        ),

        Number(
            match[3]
        )

    ];
}


function luminance(rgb) {

    if (!rgb) {

        return null;
    }


    const normalized =
        rgb.map(

            function (value) {

                return
                    value
                    /
                    255;
            }
        );


    return
        0.2126
        *
        normalized[0]
        +
        0.7152
        *
        normalized[1]
        +
        0.0722
        *
        normalized[2];
}


/*
 * Tatsächliche Symcon-Kachel ausserhalb des HTML-SDK prüfen.
 *
 * Desktop hatte bisher:
 *
 * dunkle Symcon-Kachel
 * aber HTML-SDK meldete Light-Farben.
 *
 * Deshalb ist die umgebende Kachel unsere erste Referenz.
 */

function getParentTileBackground() {

    try {

        let element =
            window.frameElement;


        let steps =
            0;


        while (
            element
            &&
            steps < 10
        ) {

            const style =
                window.parent
                    .getComputedStyle(
                        element
                    );


            const background =
                parseRgb(
                    style.backgroundColor
                );


            if (
                background
                &&
                luminance(
                    background
                )
                !==
                null
            ) {

                return
                    background;
            }


            element =
                element.parentElement;


            steps++;
        }

    } catch (error) {

        /*
         * App / WebView kann Parentzugriff blockieren.
         * Dann benutzen wir unten den Fallback.
         */
    }


    return null;
}


function detectSymconTheme() {

    /*
     * ---------------------------------------------------------
     * 1. Tatsächlicher Hintergrund der Symcon-Kachel
     * ---------------------------------------------------------
     */

    const parentBackground =
        getParentTileBackground();


    const parentLuminance =
        luminance(
            parentBackground
        );


    if (
        parentLuminance
        !==
        null
    ) {

        return
            parentLuminance
            <
            0.50

                ?

                "dark"

                :

                "light";
    }


    /*
     * ---------------------------------------------------------
     * 2. Symcon content-color als Fallback
     * ---------------------------------------------------------
     */

    const rootStyle =
        getComputedStyle(
            document.documentElement
        );


    const contentColor =
        parseRgb(
            rootStyle
                .getPropertyValue(
                    "--content-color"
                )
                .trim()
        );


    const contentLuminance =
        luminance(
            contentColor
        );


    if (
        contentLuminance
        !==
        null
    ) {

        /*
         * Helle Schrift => dunkles Theme.
         */
        return
            contentLuminance
            >
            0.60

                ?

                "dark"

                :

                "light";
    }


    /*
     * ---------------------------------------------------------
     * 3. Letzter Fallback
     * ---------------------------------------------------------
     *
     * Nicht primär verwenden!
     *
     * OS/Browser kann ein anderes Theme haben als Symcon.
     */

    if (
        window.matchMedia
        &&
        window
            .matchMedia(
                "(prefers-color-scheme: dark)"
            )
            .matches
    ) {

        return "dark";
    }


    return "light";
}


function syncTheme() {

    const theme =
        detectSymconTheme();


    if (
        document
            .documentElement
            .dataset
            .sbTheme
        !==
        theme
    ) {

        document
            .documentElement
            .dataset
            .sbTheme =
                theme;
    }
}


/* ============================================================
   LIVE
============================================================ */

function handleMessage(data) {

    if (
        typeof data
        ===
        "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            return;
        }
    }


    if (
        !data
        ||
        typeof data
        !==
        "object"
    ) {

        return;
    }


    currentData =
        data;


    applyData();
}


/* ============================================================
   RESIZE
============================================================ */

const resizeObserver =
    new ResizeObserver(

        function () {

            syncTheme();

            renderMode();
        }
    );


resizeObserver.observe(
    document.documentElement
);


/* ============================================================
   START
============================================================ */

window.addEventListener(

    "load",

    function () {

        syncTheme();

        renderMode();

        applyData();


        if (
            typeof requestAction
            ===
            "function"
        ) {

            requestAction(
                "Refresh",
                true
            );
        }


        /*
         * Falls Symcon das Theme live ändert,
         * ziehen wir es nach.
         *
         * Keine HTML-Neuladung.
         */

        window.setInterval(
            syncTheme,
            1500
        );
    }
);
